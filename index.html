<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L&S Fabco Safety Training</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --ink: #1B1D1E;
    --ink-soft: #4A4E51;
    --bg: #F6F5F1;
    --card: #FFFFFF;
    --border: #E3E0D8;
    --green: #2F7D52;
    --green-deep: #1F5C3B;
    --green-tint: #E5F1EA;
    --amber: #C77C1F;
    --amber-tint: #FBEEDC;
    --red: #B23A2E;
    --red-tint: #F8E6E3;
    --focus: #1768D1;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #EDEDEA; --ink-soft: #B7BAB6; --bg: #17181A; --card: #201F1D;
      --border: #38362F; --green: #4FAE7C; --green-deep: #78CDA1; --green-tint: #1C2E24;
      --amber: #E3A248; --amber-tint: #332512; --red: #E07B6C; --red-tint: #33201B;
    }
  }
  :root[data-theme="dark"] {
    --ink: #EDEDEA; --ink-soft: #B7BAB6; --bg: #17181A; --card: #201F1D;
    --border: #38362F; --green: #4FAE7C; --green-deep: #78CDA1; --green-tint: #1C2E24;
    --amber: #E3A248; --amber-tint: #332512; --red: #E07B6C; --red-tint: #33201B;
  }

  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  #app { max-width: 640px; margin: 0 auto; min-height: 100%; padding-bottom: 48px; }

  .topbar {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: var(--ink); color: #fff;
    padding: 14px 18px calc(14px + env(safe-area-inset-top, 0px) * 0);
    padding-top: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    border-bottom: 3px solid var(--green);
  }
  .topbar .mark { font-weight: 800; font-size: 17px; letter-spacing: 0.2px; }
  .topbar .mark span { color: var(--green-deep); }
  .topbar .who { font-size: 12px; opacity: 0.8; text-align: right; line-height: 1.3; }
  .topbar button.link { background: none; border: none; color: #fff; text-decoration: underline; font-size: 12px; padding: 0; }

  .content { padding: 16px; }

  .name-gate { padding: 28px 20px; }
  .name-gate h1 { font-size: 22px; margin: 0 0 6px; }
  .name-gate p { color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  input[type=text] {
    width: 100%; padding: 14px 14px; font-size: 16px; border-radius: 10px;
    border: 1.5px solid var(--border); background: var(--card); color: var(--ink);
  }
  input[type=text]:focus, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--green); color: #fff; border: none; border-radius: 10px;
    padding: 14px 20px; font-size: 16px; font-weight: 700; cursor: pointer;
    width: 100%; margin-top: 14px;
  }
  .btn:active { background: var(--green-deep); }
  .btn.secondary { background: transparent; color: var(--green-deep); border: 1.5px solid var(--green); }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1.5px solid var(--border); }
  .btn[disabled] { opacity: 0.45; }

  .category { margin-bottom: 22px; }
  .category h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-soft); margin: 0 0 10px; padding-left: 12px;
    border-left: 4px solid var(--green);
  }
  .module-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 14px; margin-bottom: 8px; cursor: pointer; text-align: left; width: 100%;
  }
  .module-row .title { font-weight: 700; font-size: 15.5px; flex: 1; }
  .module-row .meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }
  .pill {
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
    white-space: nowrap;
  }
  .pill.none { background: var(--border); color: var(--ink-soft); }
  .pill.current { background: var(--green-tint); color: var(--green-deep); }
  .pill.retrain { background: var(--amber-tint); color: var(--amber); }
  .chevron { color: var(--ink-soft); font-size: 18px; }

  .back-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .back-btn { background: none; border: none; color: var(--green-deep); font-size: 15px; font-weight: 700; padding: 6px 0; cursor: pointer; }

  h1.module-title { font-size: 23px; margin: 0 0 4px; }
  .module-sub { color: var(--ink-soft); font-size: 13.5px; margin-bottom: 18px; }

  .sec h3 { font-size: 16px; margin: 20px 0 8px; color: var(--green-deep); }
  .sec p { line-height: 1.55; font-size: 15px; margin: 0 0 10px; }
  ol.lettered { padding-left: 22px; margin: 0 0 12px; }
  ol.lettered li { margin-bottom: 8px; line-height: 1.5; font-size: 15px; }
  ul.checklist { list-style: none; padding: 0; margin: 0 0 12px; }
  ul.checklist li { padding-left: 26px; position: relative; margin-bottom: 8px; line-height: 1.45; font-size: 14.5px; }
  ul.checklist li::before {
    content: ""; position: absolute; left: 0; top: 3px; width: 15px; height: 15px;
    border: 1.5px solid var(--ink-soft); border-radius: 3px;
  }
  .note {
    background: var(--amber-tint); border-left: 4px solid var(--amber);
    padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; line-height: 1.5; margin: 0 0 14px;
  }

  .checklist-banner {
    background: var(--green-tint); border: 1px solid var(--green); border-radius: 10px;
    padding: 14px; font-size: 14px; line-height: 1.5; margin-top: 18px;
  }
  .checklist-banner strong { color: var(--green-deep); }

  .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
  .progress-fill { height: 100%; background: var(--green); transition: width 0.25s ease; }
  .q-count { font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
  .q-stem { font-size: 18px; font-weight: 700; line-height: 1.4; margin-bottom: 18px; }
  .opt {
    display: block; width: 100%; text-align: left; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 10px; padding: 14px;
    margin-bottom: 10px; font-size: 15px; line-height: 1.4; cursor: pointer; color: var(--ink);
  }
  .opt.selected { border-color: var(--green); background: var(--green-tint); font-weight: 700; }
  .nav-row { display: flex; gap: 10px; margin-top: 18px; }
  .nav-row .btn { margin-top: 0; }

  .score-hero { text-align: center; padding: 20px 0 6px; }
  .score-num { font-size: 52px; font-weight: 800; line-height: 1; }
  .score-label { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
  .verdict { display: inline-block; margin-top: 12px; padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 13.5px; }
  .verdict.pass { background: var(--green-tint); color: var(--green-deep); }
  .verdict.retrain { background: var(--amber-tint); color: var(--amber); }

  .review-item { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
  .review-item .stem { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .review-item .your-answer { font-size: 13.5px; }
  .review-item.wrong .your-answer { color: var(--red); }
  .review-item.right .your-answer { color: var(--green-deep); }
  .review-item .explain { font-size: 13px; color: var(--ink-soft); margin-top: 6px; line-height: 1.45; }

  label.field-label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-soft); margin: 14px 0 6px; }
  .check-row { display: flex; align-items: flex-start; gap: 10px; margin: 16px 0; }
  .check-row input { margin-top: 3px; width: 18px; height: 18px; }
  .check-row label { font-size: 14px; line-height: 1.45; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--ink-soft); }

  table.admin-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 12px; }
  table.admin-table th, table.admin-table td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  table.admin-table th { background: var(--ink); color: #fff; }
  textarea.export-box {
    width: 100%; height: 140px; font-family: ui-monospace, monospace; font-size: 12px;
    border: 1.5px solid var(--border); border-radius: 8px; padding: 10px; background: var(--card); color: var(--ink);
    margin-top: 10px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script id="modules-data" type="application/json">[{"file": "LSFabco_Forklift_Material_Handling_Training.docx", "title": "Forklift Material Handling", "sections": [{"heading": null, "paragraphs": ["Nationally, forklift-related incidents cause dozens of worker deaths and tens of thousands of injuries every year, and the large majority trace back to operator error rather than equipment failure. Because of their weight, power, and restricted visibility, forklifts can go from routine to catastrophic in an instant if operated carelessly. Training, evaluation, and authorization exist to keep that from happening on our jobs."]}, {"heading": "Types of Powered Industrial Trucks", "paragraphs": ["OSHA organizes powered industrial trucks into seven classes based on power source, tires, and intended use. Operators must be trained and evaluated on the specific class and type of truck they will run \u2014 certification on one class or model does not automatically authorize someone to run a different one.", "I.\tElectric Motor Rider Trucks \u2014 common sit-down or stand-up counterbalanced trucks for indoor/outdoor use.", "II.\tElectric Motor Narrow Aisle Trucks \u2014 order pickers and reach trucks for tight warehouse aisles.", "III.\tElectric Motor Hand Trucks / Hand-Rider Trucks \u2014 pallet jacks and walkie stackers.", "IV.\tInternal Combustion Engine Trucks, Cushion Tires \u2014 smooth-surface indoor/outdoor use.", "V.\tInternal Combustion Engine Trucks, Pneumatic Tires \u2014 rougher outdoor surfaces.", "VI.\tElectric and Internal Combustion Tractors \u2014 tow/tug tractors for towing loads rather than lifting them.", "VII.\tRough Terrain Forklift Trucks \u2014 unimproved or disturbed construction-site terrain."]}, {"heading": "Operator Training, Evaluation & Authorization", "paragraphs": ["Under 29 CFR 1910.178(l), only operators who have completed formal instruction, hands-on practical training, and a workplace performance evaluation may operate a forklift or other powered industrial truck. Certification is specific to the truck type, attachments, and the workplace conditions where it's used.", "a.\tPerformance is re-evaluated at least every 3 years.", "b.\tRefresher training is required after any unsafe operation, a near-miss or accident, an evaluation revealing unsafe operation, assignment to a different truck type, or a change in workplace conditions.", "c.\tOperators must be at least 18 years old.", "d.\tTrainees may only operate a forklift under the direct supervision of a person qualified to train and evaluate operators, and only where doing so does not endanger the trainee or others."]}, {"heading": "Pre-Shift Inspection", "paragraphs": ["Every operator inspects the truck before each shift, covering three categories:", "\u2610\tVisual/overall condition \u2014 forks, mast, chains, tires, overhead guard, and body free of cracks, damage, or excessive wear.", "\u2610\tFluids \u2014 fuel/charge level, hydraulic fluid, engine oil, coolant, and battery water (as applicable) at proper levels.", "\u2610\tOperation \u2014 brakes, steering, horn, lights, backup alarm, seatbelt, and lift/tilt controls all function correctly.", "Note:\tAny safety defect takes the truck out of service until it is repaired by authorized maintenance personnel. Cosmetic issues alone do not have to stop operations, but must still be reported."]}, {"heading": "Understanding Stability: The Triangle & the Load Center", "paragraphs": ["Most sit-down counterbalanced forklifts are supported at three points \u2014 the pivot point of the rear axle and the two front wheels. Draw imaginary lines between those points and you get the stability triangle. As long as the combined center of gravity of the truck and its load stays inside that triangle, the truck is stable; once it moves outside, the truck can tip.", "a.\tA forklift's rated capacity is set at a standard load center (typically 24 inches from the face of the forks) \u2014 a load whose own center of gravity sits farther out than that reduces how much weight can safely be carried, even if it's under the number on the data plate.", "b.\tRaising a load raises the combined center of gravity and can push it toward the edge of the stability triangle \u2014 this is why loads travel low (about 4 to 6 inches off the ground) and tilted back, not high.", "c.\tSudden acceleration, braking, or sharp turns shift the combined center of gravity suddenly and can destabilize an otherwise safely loaded truck.", "d.\tUneven, sloped, or soft ground changes the effective stability triangle \u2014 slow down and treat rough or graded surfaces with extra care.", "Note:\tIf the truck begins to tip: do not jump. Stay in the seat, hold on firmly, brace yourself, and lean away from the direction of the fall. Jumping clear is one of the most common causes of death in tip-over incidents.", "Note:\tThis module covers standard counterbalanced forklifts. Extended-reach forklifts (telehandlers) have a different stability picture and are covered in a separate Extended-Reach Forklift (Telehandler) Safety Training module \u2014 operators must be trained and evaluated separately on that equipment."]}, {"heading": "Avoiding the Primary Hazard Categories", "paragraphs": []}, {"heading": "Striking a Person or Object", "paragraphs": ["a.\tNever drive toward a person standing in front of a fixed object.", "b.\tStay within delineated travel lanes/aisles where they exist.", "c.\tSound the horn at blind corners, doorways, and intersections, and slow down where vision is restricted.", "d.\tIf the load blocks the forward view, travel with the load trailing (in reverse).", "e.\tNever allow anyone to stand or walk under a raised load or any elevated part of the truck."]}, {"heading": "Falling Loads", "paragraphs": ["a.\tDo not overstack \u2014 loads should be interlaced or banded so they don't shift.", "b.\tGet the forks as far under the load as possible before lifting.", "c.\tTravel with the load low and tilted back for stability.", "d.\tNever exceed the truck's rated capacity for the actual load center.", "e.\tA load backrest extension reduces the chance of material falling rearward toward the operator."]}, {"heading": "Tipping Over", "paragraphs": ["a.\tStay within designated travel lanes and avoid sharp turns or sudden movements, especially at speed.", "b.\tOn ramps or grades, travel straight up or down \u2014 never diagonally \u2014 with a loaded truck facing upgrade.", "c.\tBefore entering a trailer: verify the tractor is shut off or disconnected, the trailer is chocked and/or the brakes are engaged, the trailer is squared to the dock, the dock plate is secure, the trailer floor can support the truck and load, and lighting inside is adequate."]}, {"heading": "Fire or Explosion During Refueling/Recharging", "paragraphs": ["a.\tNo smoking or open flame during any part of refueling or battery charging \u2014 no exceptions.", "b.\tRefuel or recharge only in designated, ventilated areas with an appropriate fire extinguisher available.", "c.\tFollow the manufacturer's owner's manual and local fire code for the specific fuel/battery type."]}, {"heading": "Pedestrian & Traffic Safety", "paragraphs": ["a.\tYield to pedestrians and give them ample room when passing.", "b.\tUse a spotter when visibility is limited and be aware of blind spots; use mirrors.", "c.\tMaintain communication with ground personnel (radios or hand signals) in active work areas.", "d.\tOperate at a speed that allows the truck and load to stop safely and smoothly for conditions."]}, {"heading": "Enclosed Environments", "paragraphs": ["Note:\tClosed environments with insufficient ventilation can allow a buildup of carbon monoxide or diesel exhaust from internal combustion trucks. Prefer electric (Class I\u2013III) trucks indoors where practical, and ensure adequate ventilation whenever an IC truck must run in an enclosed space."]}, {"heading": "Parking & Shutdown", "paragraphs": ["a.\tPark only in designated areas, never blocking exits, fire equipment, or electrical panels.", "b.\tLower the forks fully flat to the ground.", "c.\tShift to neutral and set the parking brake.", "d.\tShut off the engine/power and remove the key to prevent unauthorized use."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Who may operate a forklift at L&S Fabco?", "options": ["Anyone with a valid driver's license", "Anyone who has watched a safety video", "Only operators trained, evaluated, and certified for that truck and workplace", "Any employee over 21"], "answer": "C", "explain": "29 CFR 1910.178(l) requires formal instruction, hands-on training, and a workplace-specific evaluation before anyone operates a forklift."}, {"num": 2, "type": "Multiple Choice", "stem": "At minimum, how often must a forklift operator's performance be re-evaluated?", "options": ["Every 10 years", "Only once, at hire", "Every month", "Every 3 years"], "answer": "D", "explain": "29 CFR 1910.178(l)(4)(iii) sets a 3-year floor for re-evaluation, with refresher training required sooner if triggered by an incident or a change in conditions."}, {"num": 3, "type": "Multiple Choice", "stem": "What must be done before operating a forklift at the start of a shift?", "options": ["Only a visual check from a distance", "A complete pre-shift inspection", "Nothing, if it was inspected last week", "Only check the fuel gauge"], "answer": "B", "explain": "A full pre-shift inspection (visual condition, fluids, and operating controls) catches developing problems before they cause an incident."}, {"num": 4, "type": "True/False", "stem": "Cosmetic damage on a forklift (scratched paint, a dented panel) requires the truck to be taken out of service just like a safety defect.", "options": [], "answer": "False", "explain": "Safety defects always take a truck out of service until repaired. Cosmetic damage does not have to stop operations."}, {"num": 5, "type": "Multiple Choice", "stem": "A forklift's three-point suspension \u2014 formed by the rear axle pivot and the two front wheels \u2014 creates what safety concept?", "options": ["The stability triangle", "The safety zone", "The tip boundary", "The balance line"], "answer": "A", "explain": "OSHA's forklift standard (29 CFR 1910.178, Appendix A) describes this three-point support as the stability triangle. As long as the combined center of gravity of the truck and load stays inside it, the truck won't tip."}, {"num": 6, "type": "Multiple Choice", "stem": "A forklift's rated capacity on its data plate is typically based on what standard load center?", "options": ["24 inches", "12 inches", "48 inches", "36 inches"], "answer": "A", "explain": "Most data plates rate capacity at a 24-inch load center. A load whose center of gravity sits farther out than that reduces how much the truck can safely carry."}, {"num": 7, "type": "True/False", "stem": "Raising a load can shift the combined center of gravity of the truck and load outside the stability triangle, increasing the risk of tipping.", "options": [], "answer": "True", "explain": "The higher a load is raised, the more the combined center of gravity can move \u2014 which is exactly why loads should travel low, not high."}, {"num": 8, "type": "Multiple Choice", "stem": "While traveling, a load should generally be carried:", "options": ["Dragging on the ground", "Level with the operator's eyes", "4 to 6 inches off the ground, mast tilted back", "As high as possible for visibility"], "answer": "C", "explain": "Keeping the load low (about 4\u20136 inches) and the mast tilted back keeps the combined center of gravity low and stable, and reduces the chance of hitting overhead objects."}, {"num": 9, "type": "Multiple Choice", "stem": "If a load blocks the operator's forward view, the operator should:", "options": ["Continue forward and rely on the horn", "Speed up to clear the area quickly", "Travel with the load trailing (drive in reverse)", "Lean out to the side to see around it"], "answer": "C", "explain": "When the load restricts visibility, travel with the load trailing so the operator can see the direction of travel."}, {"num": 10, "type": "Multiple Choice", "stem": "Before lifting a load, forks should be positioned:", "options": ["As far under the load as possible", "Wherever is fastest", "Only under one side of the load", "Under just the front edge of the load"], "answer": "A", "explain": "Getting the forks fully under the load keeps it stable and reduces the chance it will tip or slide off the forks."}, {"num": 11, "type": "True/False", "stem": "A load backrest extension helps prevent part of the load from falling rearward toward the operator.", "options": [], "answer": "True", "explain": "The backrest extension is there specifically to catch material that could otherwise shift back toward the operator's compartment."}, {"num": 12, "type": "Multiple Choice", "stem": "If a forklift begins to tip over, the operator should:", "options": ["Stay in the seat, hold on, brace, and lean away from the direction of the fall", "Jump clear immediately", "Try to counter-steer out of it", "Stand up in the compartment"], "answer": "A", "explain": "Jumping is one of the most common causes of death in tip-over incidents \u2014 the operator lands where the truck's frame or overhead guard comes down. Staying belted in and leaning away gives the overhead guard a chance to protect you."}, {"num": 13, "type": "True/False", "stem": "If a forklift tips, the safest response is to jump clear of the truck before it lands.", "options": [], "answer": "False", "explain": "Do not jump. Stay in the seat, hold on, brace yourself, and lean away from the direction of the fall."}, {"num": 14, "type": "Multiple Choice", "stem": "Smoking or an open flame during refueling or battery charging is:", "options": ["Never allowed, under any circumstances", "Allowed if a fire extinguisher is nearby", "Allowed briefly if quick", "Allowed outdoors only"], "answer": "A", "explain": "Refueling and battery charging involve flammable fuel vapors or hydrogen gas \u2014 there is no safe exception for smoking or an open flame."}, {"num": 15, "type": "Multiple Choice", "stem": "Refueling or recharging a forklift should take place:", "options": ["Only in a designated, ventilated area with an appropriate fire extinguisher available", "With the engine running to save time", "Anywhere convenient to save time", "Indoors, away from weather"], "answer": "A", "explain": "Designated refueling/charging areas are set up with the right ventilation, spill containment, and fire protection for the hazard."}, {"num": 16, "type": "Multiple Choice", "stem": "Before driving a forklift into a trailer to load or unload, the operator must first verify:", "options": ["The trailer door is painted the right color", "The trailer brakes are set and the wheels are chocked", "The trailer driver is watching", "Nothing extra is needed if the dock looks fine"], "answer": "B", "explain": "A trailer that shifts away from the dock while a loaded forklift is inside it is one of the most serious forklift accidents there is \u2014 always verify brakes, chocks, and a secure dock plate yourself."}, {"num": 17, "type": "True/False", "stem": "Trailer brakes alone can always be trusted, so chocking the wheels before driving a forklift into a trailer is unnecessary.", "options": [], "answer": "False", "explain": "Don't count on the trailer being secured just because the brakes are supposedly set. Physically verify the trailer is chocked and the dock plate is secure."}, {"num": 18, "type": "Multiple Choice", "stem": "On a ramp or sloped surface, a loaded forklift should travel:", "options": ["Straight up or down, with the load facing upgrade", "At normal travel speed regardless of grade", "Diagonally, to reduce the grade", "In reverse only"], "answer": "A", "explain": "Traveling diagonally on a grade increases tipping risk. Loaded trucks should go straight up or down the grade with the load pointed upgrade."}, {"num": 19, "type": "True/False", "stem": "Operating an internal combustion forklift in an enclosed area with poor ventilation can allow dangerous carbon monoxide or exhaust levels to build up.", "options": [], "answer": "True", "explain": "Closed environments with insufficient ventilation are a specific hazard called out in forklift operator training \u2014 use electric trucks indoors where possible, or ensure adequate ventilation."}, {"num": 20, "type": "Multiple Choice", "stem": "At the end of a shift, a forklift should be parked with the forks:", "options": ["Raised only if parked outdoors", "Fully lowered flat on the ground, in neutral, brake set, key removed", "Left wherever they were during the last task", "Raised, so they're visible"], "answer": "B", "explain": "Forks left raised are a tripping and impalement hazard and can roll or drift. Always lower forks fully flat, set the parking brake, shift to neutral, shut off power, and remove the key."}], "has_checklist": true, "name": "Forklift", "category": "Powered Equipment"}, {"file": "LSFabco_Telehandler_Extended_Reach_Training.docx", "title": "Telehandler Extended Reach", "sections": [{"heading": null, "paragraphs": ["A telehandler (telescopic handler, or \u201cextended-reach\u201d forklift) replaces the vertical mast of a standard forklift with a telescoping boom that extends forward and upward. That reach is the whole point of the machine, but it's also its biggest hazard: as the boom extends or rises with a load on it, it acts as a lever, and rated capacity drops fast \u2014 a machine that safely lifts several thousand pounds with the boom retracted may safely lift only a few hundred pounds at full extension. Standard forklift experience does not automatically transfer; boom geometry creates a different stability picture."]}, {"heading": "Operator Training, Evaluation & Authorization", "paragraphs": ["As with any powered industrial truck, only operators who have completed formal instruction, hands-on practical training, and a workplace performance evaluation may operate a telehandler.", "a.\tTraining and evaluation must be specific to the telehandler model and to each attachment (forks, bucket, winch, personnel platform, etc.) the operator will use.", "b.\tPerformance is re-evaluated at least every 3 years, or sooner after any unsafe operation, near-miss, accident, assignment to a different machine, or a change in workplace conditions.", "c.\tPersonnel-lifting attachments (baskets/platforms) involve additional requirements beyond material handling \u2014 confirm the applicable manufacturer and regulatory requirements before any personnel-lifting use."]}, {"heading": "Pre-Shift Inspection", "paragraphs": ["In addition to the usual visual, fluid, and operating checks common to powered industrial trucks, a telehandler inspection covers:", "\u2610\tStabilizer/outrigger pads free of cracks, and the interlock that prevents boom operation without them deployed (where equipped) is functional.", "\u2610\tFrame level indicator is calibrated and accurate.", "\u2610\tLoad Moment Indicator (LMI), where equipped, tested and not bypassed.", "\u2610\tThe load chart present in the cab is legible and correct for the attachment currently mounted.", "\u2610\tBoom sections, pivot points, forks/attachment locking pins, tires, and hydraulic hoses/cylinders free of damage or leaks.", "Note:\tAny safety defect takes the machine out of service until repaired by authorized maintenance personnel."]}, {"heading": "Reading & Using the Load Chart", "paragraphs": ["a.\tTelehandler load charts are two-dimensional \u2014 rated capacity depends on both boom angle/height and how far it's extended (reach), not a single number. Always check the chart for the actual height and reach of the lift, not just the machine's maximum rated capacity.", "b.\tWhere the machine has outriggers/stabilizers, deploy them on solid, level ground before lifting at extended reach \u2014 load charts often list separate capacities for \u201coutriggers up\u201d versus \u201coutriggers down.\u201d", "c.\tLevel the machine using the frame/level indicator before raising the boom. Never use the leveling system or outriggers to relevel once a load is already in the air \u2014 bring the load back down first.", "d.\tWhere equipped, a Load Moment Indicator (LMI) warns when a lift is approaching or exceeding rated capacity for the current boom position \u2014 it must never be silenced, bypassed, or ignored.", "e.\tEach attachment changes the load chart; confirm the correct chart for the attachment actually mounted before lifting, and confirm authorization for that specific attachment."]}, {"heading": "Traveling & Site Hazards", "paragraphs": ["a.\tTravel only with the boom fully retracted and lowered to the carry position; never travel with the boom extended or raised.", "b.\tExtended reach puts the boom tip closer to overhead power lines than the machine's body suggests \u2014 maintain minimum approach distances for the boom's maximum reach, not its retracted height.", "c.\tKeep clear of trenches, excavations, and uncompacted fill \u2014 outrigger or tire loading near an unsupported edge can cause ground failure.", "d.\tSound the horn at blind corners and intersections; keep clear of pedestrians and use a spotter when visibility is limited.", "e.\tAvoid sudden acceleration, braking, or sharp turns, especially with a load raised or extended."]}, {"heading": "Refueling & Parking", "paragraphs": ["a.\tNo smoking or open flame during any part of refueling or battery charging \u2014 refuel or recharge only in designated, ventilated areas with a fire extinguisher available.", "b.\tPark on level ground in a designated area.", "c.\tFully retract and lower the boom, retract outriggers, set the parking brake, shut off power, and remove the key."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "A telehandler replaces the vertical mast of a standard forklift with what?", "options": ["A wider chassis", "A second set of forks", "A fixed-length arm", "A telescoping boom"], "answer": "D", "explain": "The telescoping boom extends forward and upward, which is what gives the telehandler its reach \u2014 and its very different stability behavior."}, {"num": 2, "type": "Multiple Choice", "stem": "As a telehandler's boom extends outward, its rated lifting capacity:", "options": ["Stays the same", "Decreases", "Only changes with a heavy load", "Increases"], "answer": "B", "explain": "The extending boom acts as a lever \u2014 a machine that lifts several thousand pounds retracted may safely lift only a few hundred pounds at full extension."}, {"num": 3, "type": "Multiple Choice", "stem": "A telehandler load chart shows rated capacity based on which two factors?", "options": ["Time of day and weather", "Boom angle/height and reach (extension)", "Engine size and operator weight", "Fuel level and tire pressure"], "answer": "B", "explain": "Telehandler load charts are two-dimensional grids: capacity depends on both how high/angled the boom is and how far it's extended."}, {"num": 4, "type": "True/False", "stem": "The maximum capacity printed on a telehandler's data plate is the safe capacity for every lift, regardless of reach.", "options": [], "answer": "False", "explain": "That number reflects one specific condition, usually boom retracted. Always check the load chart for the actual height and reach of the lift you're making."}, {"num": 5, "type": "Multiple Choice", "stem": "Before lifting at extended reach on a machine equipped with outriggers/stabilizers, they must be:", "options": ["Deployed only outdoors", "Deployed only if the load looks heavy", "Left retracted to save time", "Deployed on solid, level ground"], "answer": "D", "explain": "Outriggers widen the effective base of support for extended-reach lifts. Load charts often list separate capacities for outriggers up versus deployed."}, {"num": 6, "type": "Multiple Choice", "stem": "When must a telehandler be leveled using its frame/level indicator?", "options": ["Leveling is not necessary on a telehandler", "Only at the end of the shift", "Before raising the boom", "Only if it feels unlevel"], "answer": "C", "explain": "The machine should be leveled before the boom is raised, since the leveling/outrigger system should not be used to correct a load that's already elevated."}, {"num": 7, "type": "True/False", "stem": "If a raised load turns out to be unlevel, it's fine to use the frame leveling system or outriggers to correct it while the load stays in the air.", "options": [], "answer": "False", "explain": "Bring the load back down first, then relevel the machine. Adjusting the frame or outriggers under an elevated load can destabilize the machine further."}, {"num": 8, "type": "Multiple Choice", "stem": "How should the boom be positioned while traveling from one task to another?", "options": ["Extended partway for a head start on the next lift", "Fully retracted and lowered to the carry position", "Position doesn't matter below 5 mph", "Raised, for better visibility"], "answer": "B", "explain": "Travel only with the boom fully retracted and lowered \u2014 an extended or raised boom while traveling is a leading cause of tip-overs."}, {"num": 9, "type": "Multiple Choice", "stem": "A Load Moment Indicator (LMI) alarm activating during a lift means the operator should:", "options": ["Ignore it if the job is almost finished", "Deploy outriggers mid-lift to compensate", "Silence it and continue, since the wheels are still down", "Stop, and reduce the load or retract the boom until the alarm clears"], "answer": "D", "explain": "An LMI alarm means the lift is approaching or exceeding rated capacity for the current boom position. It must never be bypassed or silenced."}, {"num": 10, "type": "True/False", "stem": "Experience operating a standard counterbalance forklift automatically qualifies someone to operate a telehandler.", "options": [], "answer": "False", "explain": "Boom geometry gives telehandlers a very different stability picture. Operators need training and evaluation specific to the telehandler and any attachment they'll use."}, {"num": 11, "type": "Multiple Choice", "stem": "A thorough telehandler pre-shift inspection should include checking:", "options": ["Only tire pressure", "Nothing beyond a standard forklift's checklist", "Stabilizer pads and interlock, level indicator calibration, LMI test, and that the correct load chart is present for the mounted attachment", "Only the fuel gauge"], "answer": "C", "explain": "Telehandlers add inspection points a standard forklift doesn't need \u2014 stabilizer condition and interlock, level indicator accuracy, a working LMI, and the correct chart for whatever attachment is mounted."}, {"num": 12, "type": "Multiple Choice", "stem": "Extended boom reach increases the risk of contact with:", "options": ["Overhead power lines", "Other forklifts only", "Nothing beyond a standard forklift's risk", "Underground utilities only"], "answer": "A", "explain": "Because the boom tip reaches farther and higher than the machine's body suggests, minimum approach distances must account for the boom's maximum reach, not its retracted height."}, {"num": 13, "type": "True/False", "stem": "Outrigger or tire loading near a trench, excavation, or uncompacted fill edge is safe as long as the ground looks solid.", "options": [], "answer": "False", "explain": "Ground that looks solid can still fail under concentrated outrigger or tire loading near an unsupported edge. Keep clear of trenches, excavations, and uncompacted fill."}, {"num": 14, "type": "Multiple Choice", "stem": "Changing a telehandler's attachment (for example, from forks to a bucket) means the operator must:", "options": ["Notify no one, since attachments don't affect capacity", "Continue using the fork load chart, since it's the same machine", "Use the load chart specific to that attachment, and confirm authorization to use it", "Only worry about it if the attachment looks heavy"], "answer": "C", "explain": "Each attachment changes the load chart, and some attachments (like personnel platforms) require separate authorization beyond material handling."}, {"num": 15, "type": "Multiple Choice", "stem": "At the end of a shift, a telehandler should be parked with the boom:", "options": ["Fully retracted and lowered, outriggers retracted, brake set, key removed", "Extended, so it's ready for the next task", "Raised, for visibility", "In whatever position is fastest"], "answer": "A", "explain": "Shutdown mirrors the travel position: boom fully retracted and lowered, outriggers retracted, parking brake set, power off, and key removed."}], "has_checklist": true, "name": "Telehandler", "category": "Powered Equipment"}, {"file": "LSFabco_Aerial_Lift_Training.docx", "title": "Aerial Lift", "sections": [{"heading": null, "paragraphs": ["\u201cAerial lift\u201d covers a range of equipment \u2014 boom lifts, scissor lifts, ladder trucks \u2014 now collectively referred to by the ANSI A92.20 standard as Mobile Elevating Work Platforms (MEWPs). Boom lifts and scissor lifts behave very differently in a sudden movement, and OSHA's fall protection rules for them are not the same. Getting that distinction right is the most important thing in this training."]}, {"heading": "Training & Authorization", "paragraphs": ["a.\tOnly operators trained, evaluated, and authorized on the specific type of lift (boom or scissor) may operate it \u2014 certification on one category doesn't carry over to the other.", "b.\tTraining covers classroom instruction, hands-on evaluation, and a site-specific familiarization before first use at a new job site or on an unfamiliar model.", "c.\tRetraining is required after a near-miss or unsafe operation, a change to a different type or model of lift, or a change in workplace conditions."]}, {"heading": "Pre-Use Inspection", "paragraphs": ["\u2610\tControls, emergency/auxiliary descent (lowering) device, and safety interlocks tested and functioning.", "\u2610\tHydraulic system free of leaks; fluid levels adequate.", "\u2610\tTires and, where equipped, outriggers in good condition.", "\u2610\tGuardrails, chains/gates, and platform structure free of damage.", "\u2610\tPlacards, load chart, and operator's manual present and legible.", "\u2610\tFunction-test all controls at ground level before elevating with a load or worker in the platform.", "Note:\tAny safety defect takes the lift out of service until repaired \u2014 tag it and report it immediately."]}, {"heading": "Fall Protection: Boom Lifts vs. Scissor Lifts", "paragraphs": ["This is the single most misunderstood rule in aerial lift safety, so read it carefully:", "a.\tBoom lifts (articulating or telescoping boom, cherry pickers, ladder/tower trucks) \u2014 a full-body harness with a short lanyard or self-retracting lifeline, attached to the manufacturer-designated anchor point in the platform, is required at all times while in the basket, regardless of height. This is primarily a restraint requirement \u2014 to keep you from being thrown out during a sudden jolt or swing of the boom \u2014 not a classic fall-arrest system. Never tie off to the guardrail; it is not a rated anchor point.", "b.\tScissor lifts \u2014 these travel straight up and down on a fixed base and are treated like a mobile scaffold. Guardrails alone generally satisfy the fall protection requirement, as long as the operator stays inside them and never climbs or leans over a rail. Some job sites require a harness on scissor lifts as a matter of site policy \u2014 follow whichever rule is stricter for the site you're on.", "c.\tOn either type of lift, never tie off to an adjacent structure, pole, or piece of equipment \u2014 only to the lift's own designated anchor point."]}, {"heading": "Operating Rules", "paragraphs": ["a.\tNever exceed the platform's rated load capacity.", "b.\tKeep both feet on the platform floor at all times \u2014 never climb, stand, or lean on guardrails or mid-rails, and never use a ladder or plank inside the platform to gain extra height.", "c.\tClose and latch all entry gates or chains before elevating.", "d.\tMaintain safe clearance from overhead power lines and obstructions \u2014 treat the lift's maximum reach, not just its current position, as the clearance distance.", "e.\tDo not operate in wind speeds exceeding the manufacturer's rated limit for the machine.", "f.\tGround controls should not be operated while a worker is in the platform, except in an emergency or when directed by the person in the platform.", "g.\tNever move the lift while elevated unless it is specifically designed and rated by the manufacturer for that operation.", "h.\tSet up on firm, level ground; deploy outriggers where equipped before elevating."]}, {"heading": "Emergency Procedures", "paragraphs": ["a.\tKnow the location and operation of the emergency/auxiliary lowering controls before you need them.", "b.\tIn case of electrical contact, stay in the platform, warn others not to touch the lift or ground it, and call for help \u2014 do not attempt to climb down while the lift may still be energized.", "c.\tHave a rescue plan for a malfunctioning or stuck lift before work begins."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Which category of aerial lift requires a full-body harness attached to a designated anchor point at all times in the platform?", "options": ["Scissor lifts only", "Neither type requires it", "Only when working above 20 feet", "Boom lifts (articulating/telescoping)"], "answer": "D", "explain": "Boom lifts require a harness and short lanyard/SRL at all times in the basket, regardless of height \u2014 primarily to keep the operator from being thrown out during a sudden movement."}, {"num": 2, "type": "Multiple Choice", "stem": "On a scissor lift with guardrails in good condition, what does federal OSHA generally require for fall protection?", "options": ["No fall protection of any kind", "A full-body harness at all times", "Guardrails alone are generally sufficient if the operator stays inside them", "A body belt only"], "answer": "C", "explain": "Scissor lifts are treated like mobile scaffolds \u2014 guardrails alone typically satisfy the requirement, provided the operator doesn't climb or lean over them. Some sites still require a harness as added policy."}, {"num": 3, "type": "Multiple Choice", "stem": "Where should a harness lanyard be attached on a boom lift?", "options": ["The guardrail", "A nearby pole or structure", "The manufacturer's designated anchor point in the platform", "Anywhere convenient"], "answer": "C", "explain": "Guardrails are not rated anchor points. Only the manufacturer-designated anchor point in the platform is approved for tie-off."}, {"num": 4, "type": "True/False", "stem": "Certification to operate a scissor lift also authorizes an operator to run a boom lift.", "options": [], "answer": "False", "explain": "Certification is specific to the category of lift \u2014 boom and scissor lifts behave very differently and require separate training and evaluation."}, {"num": 5, "type": "Multiple Choice", "stem": "Before elevating with a worker in the platform, what should be done at ground level?", "options": ["Only check the fuel gauge", "Nothing extra is needed", "Skip inspection if used yesterday", "Function-test all controls"], "answer": "D", "explain": "Testing all controls at ground level, including the emergency lowering device, catches problems before anyone is elevated."}, {"num": 6, "type": "Multiple Choice", "stem": "Which of the following is prohibited on an aerial lift platform?", "options": ["Wearing the required harness on a boom lift", "Closing entry gates before elevating", "Keeping both feet on the platform floor", "Standing on the guardrail to reach higher"], "answer": "D", "explain": "Standing, climbing, or leaning on guardrails (or using a ladder/plank inside the platform) to gain extra height is never permitted."}, {"num": 7, "type": "Multiple Choice", "stem": "When should ground controls be operated while a worker is in the platform?", "options": ["Constantly, for supervision", "Anytime the ground worker wants", "Only after checking the weather", "Only in an emergency, or when directed by the person in the platform"], "answer": "D", "explain": "Ground controls overriding the platform operator should only be used in an emergency or at the platform operator's direction \u2014 unexpected ground-control movement is a serious hazard."}, {"num": 8, "type": "True/False", "stem": "It's acceptable to move an aerial lift while elevated as long as the operator is experienced.", "options": [], "answer": "False", "explain": "A lift may only be moved while elevated if the specific machine is designed and rated by the manufacturer for that operation \u2014 experience doesn't substitute for that rating."}, {"num": 9, "type": "Multiple Choice", "stem": "In the event of electrical contact while in an aerial lift platform, what should the operator do?", "options": ["Continue working since the lift has rubber tires", "Touch the ground and the lift at the same time to check for current", "Stay in the platform, warn others away, and call for help", "Immediately climb down to the ground"], "answer": "C", "explain": "Staying in the platform and calling for help avoids becoming a path to ground. Climbing down or touching the lift and ground simultaneously can complete a circuit through the body."}, {"num": 10, "type": "Multiple Choice", "stem": "What should be checked regarding wind before operating an aerial lift?", "options": ["Wind doesn't affect aerial lifts", "Only that it isn't raining", "Wind only matters above 100 feet", "That wind speed doesn't exceed the manufacturer's rated limit for the machine"], "answer": "D", "explain": "Every aerial lift has a manufacturer-rated maximum wind speed for operation \u2014 exceeding it significantly increases tip-over risk."}], "has_checklist": true, "name": "Aerial Lift", "category": "Powered Equipment"}, {"file": "LSFabco_Front_Loader_Training.docx", "title": "Front Loader", "sections": [{"heading": null, "paragraphs": ["Front loaders (wheel loaders) are earthmoving/material handling equipment regulated under 29 CFR 1926.602, not powered industrial trucks like a forklift. They present a different hazard profile: articulated-frame steering, large blind spots, a high center of gravity when the bucket is raised, and a genuine crush hazard at the frame's pivot point that most other equipment on our jobs doesn't have."]}, {"heading": "Operator Training & Authorization", "paragraphs": ["a.\tOnly operators trained, evaluated, and authorized on the specific make/model and attachment may operate a front loader.", "b.\tRetraining is required after an unsafe operation, a near-miss, an accident, assignment to a different machine, or a change in attachments or working conditions."]}, {"heading": "Pre-Shift Inspection", "paragraphs": ["\u2610\tSeat belt present and in good condition (required whenever the machine has ROPS or an adequate canopy \u2014 virtually every wheel loader in this class does).", "\u2610\tROPS structure and mounting hardware undamaged and unmodified.", "\u2610\tTires free of cuts, bulges, or low pressure.", "\u2610\tArticulation joint free of excessive play.", "\u2610\tHydraulic hoses and cylinders free of leaks.", "\u2610\tBucket or attachment quick-coupler pins fully locked \u2014 verified with a positive pull-test, not just a visual check.", "\u2610\tHorn and backup alarm functional; scissor points guarded.", "\u2610\tBrakes, lights, and mirrors/backup camera (if equipped) functional.", "Note:\tAny of the following takes the machine out of service immediately: ROPS damage, seat belt failure, tire sidewall damage, excessive articulation play, a hydraulic leak, brake or steering malfunction, or a quick-coupler that won't fully lock."]}, {"heading": "Seat Belts & ROPS", "paragraphs": ["a.\tThe seat belt must be worn any time the machine is being operated \u2014 the ROPS only protects an operator who is belted in.", "b.\tNever modify, drill, weld on, or use the ROPS as a lifting or anchor point without the manufacturer's engineering approval \u2014 doing so can void its protective rating."]}, {"heading": "Articulated Steering \u2014 The Crush Hazard", "paragraphs": ["A front loader steers by bending in the middle. That pivot point can swing suddenly and with enough force to crush anyone standing near it \u2014 this is a distinct hazard that doesn't exist on a straight-frame machine.", "a.\tBefore anyone works on, under, or near the articulation joint \u2014 for inspection, greasing, or maintenance \u2014 engage the frame/articulation lock bar or pin per the manufacturer's instructions.", "b.\tNever rely on the parking brake, a neutral gear, or \u201cjust being careful\u201d near the pivot point \u2014 the frame must be physically locked.", "c.\tKeep clear of the pivot area entirely during normal operation, not just during maintenance."]}, {"heading": "Bucket & Attachment Safety", "paragraphs": ["a.\tLower the bucket fully to the ground and relieve hydraulic pressure before leaving the operator's seat or performing any maintenance.", "b.\tNever work under a raised bucket or boom unless it is blocked or pinned per the manufacturer's procedure \u2014 hydraulics can fail or drift.", "c.\tKnow the rated operating capacity for the specific bucket or attachment in use, and don't exceed it."]}, {"heading": "Operating Rules", "paragraphs": ["a.\tSound the horn before moving in either direction; use the backup alarm or a spotter whenever the rear view is obstructed.", "b.\tTravel with the bucket low and curled back for visibility and stability \u2014 the same low-and-back principle used with forklifts applies here.", "c.\tNever carry passengers unless the machine has a factory-installed second seat.", "d.\tBe deliberate about blind spots \u2014 front loaders have limited rear and side visibility. Use mirrors and cameras where equipped, and use a spotter in congested areas.", "e.\tFollow the manufacturer's maximum grade/slope rating; travel straight up or down slopes rather than across them.", "f.\tKeep clear of trench and excavation edges \u2014 ground that looks solid can give way under a loaded machine.", "g.\tAccount for ground conditions and load when judging tipping risk \u2014 a stable-looking machine can still tip on soft or uneven ground with a raised or extended load."]}, {"heading": "Parking & Shutdown", "paragraphs": ["a.\tPark on level ground where practical, with the bucket lowered flat to the ground.", "b.\tSet the parking brake, shift to neutral/park, shut off the engine, and remove the key.", "c.\tIf parking on a grade is unavoidable, block the wheels in addition to setting the brake."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Under which OSHA standard are front loaders (wheel loaders) primarily regulated?", "options": ["29 CFR 1910.178 (powered industrial trucks)", "They are not regulated", "29 CFR 1926.602 (material handling / earthmoving equipment)", "29 CFR 1910.146 (confined spaces)"], "answer": "C", "explain": "Front loaders are earthmoving/material handling equipment under 1926.602, not powered industrial trucks like forklifts \u2014 the hazard profile and requirements differ accordingly."}, {"num": 2, "type": "Multiple Choice", "stem": "When must the seat belt be worn on a front loader equipped with ROPS?", "options": ["Seat belts are optional if the operator prefers", "Only on rough terrain", "Only during transport on a trailer", "Any time the machine is being operated"], "answer": "D", "explain": "The ROPS only protects an operator who is belted in \u2014 the seat belt must be worn any time the machine is operated."}, {"num": 3, "type": "Multiple Choice", "stem": "What is the specific crush hazard unique to articulated-frame loaders?", "options": ["The pivot point where the frame bends to steer", "The headlights", "The exhaust pipe", "The fuel cap"], "answer": "A", "explain": "The articulation joint can swing suddenly with enough force to crush anyone standing near it \u2014 a hazard straight-frame equipment doesn't have."}, {"num": 4, "type": "Multiple Choice", "stem": "Before anyone works near the articulation joint, what must be done?", "options": ["Engage the frame/articulation lock per the manufacturer's instructions", "Remove the seat belt", "Rev the engine to release pressure", "Nothing extra, just work carefully"], "answer": "A", "explain": "The frame must be physically locked before anyone works on, under, or near the pivot point \u2014 the parking brake alone does not prevent it from swinging."}, {"num": 5, "type": "Multiple Choice", "stem": "Before leaving the operator's seat, what must be done with the bucket?", "options": ["Leave it wherever it was during the last task", "Raise it as high as possible for visibility", "Nothing, as long as the engine is off", "Lower it fully to the ground and relieve hydraulic pressure"], "answer": "D", "explain": "A raised bucket can drift or fail. Lowering it to the ground and relieving pressure before leaving the seat removes that hazard."}, {"num": 6, "type": "True/False", "stem": "It is acceptable to work under a raised bucket as long as the engine is shut off.", "options": [], "answer": "False", "explain": "A raised bucket or boom must be blocked or pinned per the manufacturer's procedure before anyone works under it \u2014 hydraulics can fail or drift even with the engine off."}, {"num": 7, "type": "Multiple Choice", "stem": "How should a quick-coupler attachment be verified as locked?", "options": ["No verification is needed", "A positive pull-test in addition to a visual check", "Assume it's locked if it looks right", "A quick visual glance"], "answer": "B", "explain": "A visual check alone can miss a coupler that looks engaged but isn't fully locked \u2014 a positive pull-test confirms it."}, {"num": 8, "type": "Multiple Choice", "stem": "How should a front loader travel with a loaded bucket?", "options": ["Tilted forward", "It doesn't matter as long as you go slow", "Low and curled back", "Raised high for visibility"], "answer": "C", "explain": "The same low-and-back principle used with forklifts applies \u2014 it keeps the load stable and improves visibility."}, {"num": 9, "type": "Multiple Choice", "stem": "On a slope, how should a front loader travel?", "options": ["Diagonally, to reduce the grade", "Straight up or down, within the manufacturer's rated grade", "At full speed to maintain momentum", "Sideways for better traction"], "answer": "B", "explain": "Traveling diagonally on a slope increases tipping risk. Stay within the manufacturer's rated grade and travel straight up or down."}, {"num": 10, "type": "Multiple Choice", "stem": "At shutdown, how should a front loader be parked?", "options": ["On a slope facing downhill for easy departure", "On level ground with the bucket lowered flat, parking brake set, key removed", "Running, for a quick restart", "Bucket raised, anywhere convenient"], "answer": "B", "explain": "Level ground, bucket down, brake set, and key removed is the standard safe shutdown \u2014 wheels should also be blocked if parking on a grade is unavoidable."}], "has_checklist": true, "name": "Front Loader", "category": "Powered Equipment"}, {"file": "LSFabco_Welding_Cutting_Training.docx", "title": "Welding Cutting", "sections": [{"heading": null, "paragraphs": ["Welding and cutting equipment presents hazards including arc flash and arc eye, fire and explosion from sparks and slag, toxic and carcinogenic fume exposure (including hexavalent chromium from stainless and other chromium-bearing alloys), electric shock, and compressed gas cylinder hazards."]}, {"heading": "PPE Requirements", "paragraphs": ["a.\tWelding helmet with the correct shade lens for the process, with safety glasses underneath.", "b.\tFlame-resistant jacket and sleeves, welding gloves, and cuffless pants worn over boots.", "c.\tRespiratory protection where fume controls (local exhaust, fume extraction) don't bring exposure below applicable limits \u2014 required by default for stainless/chromium alloy work unless air monitoring shows otherwise.", "d.\tHearing protection when grinding or working in high-noise fabrication areas."]}, {"heading": "Pre-Use Inspection", "paragraphs": ["\u2610\tCables, leads, and torch hoses free of cuts, cracks, or exposed conductors.", "\u2610\tGround clamp makes solid metal-to-metal contact.", "\u2610\tRegulators and gauges intact; no oil or grease on oxygen fittings.", "\u2610\tCylinders secured upright (chained or in a cart) with valve caps on when not in use.", "\u2610\tA charged fire extinguisher is present in the work area."]}, {"heading": "Hot Work / Fire Watch Rules", "paragraphs": ["Cutting and welding is only permitted in areas that are fire-safe, per Cal/OSHA Title 8 Article 88 and 29 CFR 1910.252:", "a.\tMove combustibles at least 35 feet from the work, or protect them with fire-resistant covers/guards if they can't be moved.", "b.\tNever weld or cut on a used drum, tank, or container until it has been cleaned and verified free of flammable residue.", "c.\tA fire watch must be posted whenever hot work creates a fire risk to nearby combustibles, and must remain for at least 30 minutes after work stops to catch smoldering fires.", "d.\tA hot work permit is required before cutting or welding outside a designated welding area.", "Note:\tWelding or cutting inside a tank, digester, or vessel is confined-space work \u2014 follow the Confined Space Entry training in addition to the hot work rules above. Purge and ventilate before hot work begins, and monitor the atmosphere continuously while work is underway."]}, {"heading": "Cylinder & Gas Handling", "paragraphs": ["a.\tOpen cylinder valves slowly, standing to the side of the regulator, never in front of it.", "b.\tNever use oil, grease, or petroleum-based products on oxygen equipment.", "c.\tTransport cylinders with valve protection caps in place; never lift a cylinder by its cap."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "When practical, how far should combustible materials be moved from a hot work area?", "options": ["20 feet", "35 feet", "No minimum distance required", "10 feet"], "answer": "B", "explain": "Cal/OSHA Title 8 Article 88 and 29 CFR 1910.252 call for combustibles to be moved at least 35 feet when practical, or protected in place if they can't be moved."}, {"num": 2, "type": "Multiple Choice", "stem": "At minimum, how long must a fire watch remain after welding or cutting is completed?", "options": ["24 hours", "No fire watch is required", "30 minutes", "10 minutes"], "answer": "C", "explain": "29 CFR 1910.252 requires a fire watch for at least 30 minutes after hot work ends to catch smoldering fires. Some hot work permits require longer, so always check the permit."}, {"num": 3, "type": "Multiple Choice", "stem": "Before hot work on a used drum or tank, what must be confirmed?", "options": ["That it's empty, regardless of prior contents", "That it's the right color", "That it's been cleaned and is free of flammable residue", "Nothing \u2014 used containers don't need checking"], "answer": "C", "explain": "Used containers must be cleaned thoroughly so no flammable or toxic residue remains before any hot work begins on them."}, {"num": 4, "type": "Multiple Choice", "stem": "Welding stainless steel can produce which hazardous fume that requires engineering controls?", "options": ["Argon", "Helium", "Hexavalent chromium", "Carbon dioxide only"], "answer": "C", "explain": "Chromium-bearing alloys like stainless can release hexavalent chromium (Cr(VI)) when welded. Its OSHA exposure limit (5 micrograms per cubic meter) is far stricter than the limit for general weld fume."}], "has_checklist": false, "name": "Welding & Cutting", "category": "Hot Work & Trade Safety"}, {"file": "LSFabco_Rigging_Cranes_Training.docx", "title": "Rigging Cranes", "sections": [{"heading": null, "paragraphs": ["Cal/OSHA Title 8 Section 4999 and 29 CFR 1926.1425 require rigging to be performed by a qualified/certified rigger \u2014 someone trained and evaluated to select and inspect the right hardware for the load. If you have not been certified as a rigger at L&S Fabco, do not rig loads independently."]}, {"heading": "Signal Persons", "paragraphs": ["a.\tA qualified signal person is required whenever the operator's view of the point of operation, or the direction of travel, is obstructed.", "b.\tOnly a qualified signal person may give crane signals, except that anyone may give a stop signal at any time.", "c.\tA uniform hand-signal system must be used and understood by both the operator and signal person before the lift begins."]}, {"heading": "Inspecting Rigging Hardware", "paragraphs": ["\u2610\tSlings free of cuts, fraying, kinks, or corrosion.", "\u2610\tShackles, hooks, and hardware rated for the load, with functioning safety latches.", "\u2610\tRigging tagged with current inspection date and rated capacity.", "\u2610\tLoad weight known or verified before a lift approaching rated capacity."]}, {"heading": "Safe Lifting Rules", "paragraphs": ["a.\tNever walk or work underneath a suspended load, for any reason.", "b.\tEstablish and keep clear an exclusion zone under and around the load path.", "c.\tCheck load charts for the specific crane configuration \u2014 boom angle and radius change rated capacity.", "d.\tLoads are not released or detached until they are safely landed and secured."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Who is allowed to rig a load for a crane lift?", "options": ["Any available employee", "Whoever is closest to the load", "A qualified/certified rigger", "Only the crane operator"], "answer": "C", "explain": "Cal/OSHA Title 8 Section 4999 and 29 CFR 1926.1425 require rigging to be done by a qualified/certified rigger."}, {"num": 2, "type": "Multiple Choice", "stem": "When is a signal person required for a crane lift?", "options": ["Only if requested by the client", "Whenever the operator's view of the point of operation is obstructed", "Never, if the operator has 5+ years experience", "Only for loads over 10,000 lbs"], "answer": "B", "explain": "A qualified signal person is required whenever the operator can't fully see the point of operation or the direction of travel."}, {"num": 3, "type": "True/False", "stem": "It is acceptable to stand or work underneath a suspended load as long as you are wearing a hard hat.", "options": [], "answer": "False", "explain": "No PPE or approval makes it safe to be under a suspended load. This rule has no exceptions."}, {"num": 4, "type": "Multiple Choice", "stem": "Before lifting a load that may approach rated capacity, what must happen?", "options": ["Nothing extra \u2014 proceed as normal", "Only the operator's judgment is needed", "The load must be lifted slowly to test it", "The weight must be known or verified by a qualified person or load-weighing device"], "answer": "D", "explain": "Title 8 Section 4999 requires a qualified rigger or a load-weighing device to verify the load is within rated capacity before lifting."}], "has_checklist": false, "name": "Rigging, Cranes & Hoisting", "category": "Hot Work & Trade Safety"}, {"file": "LSFabco_Fire_Watch_Training.docx", "title": "Fire Watch", "sections": [{"heading": null, "paragraphs": ["A Fire Watch's job is to prevent hot work \u2014 welding, cutting, grinding, brazing \u2014 from starting a fire, and to catch it fast if one starts anyway. This is a serious responsibility: while acting as Fire Watch, that is your job, not a secondary task you do while also doing something else."]}, {"heading": "Before Work Begins", "paragraphs": ["a.\tObtain a suitable fire extinguisher and keep it close to the job site for the entire duration of the work. Do not discharge it unless there's an actual fire, and return it when the job is complete.", "b.\tKnow the exact location of firefighting equipment in the immediate area and how to operate it.", "c.\tSurvey the entire area, before work starts and as it progresses, for any potential release of flammable liquids or vapors \u2014 and make sure operations personnel know work is underway (refinery, chemical plant, bulk storage, and power plant settings especially).", "d.\tIf you have any questions about the job, consult your supervisor or the Health and Safety department before work begins \u2014 not after."]}, {"heading": "While Work Is Underway", "paragraphs": ["a.\tDo not leave the job site unattended while welding or spark-producing work is ongoing. If other duties require you to leave, either halt the work or have another qualified Fire Watch take your place first.", "b.\tPrevent sampling, venting, or opening of piping/equipment near the hot work that could release flammable liquids or vapors.", "c.\tKnow the procedure for shutting down all welding equipment in the event of a flammable liquid spill or vapor release.", "d.\tStay alert and try to anticipate hazards before they happen \u2014 don't just react after something goes wrong."]}, {"heading": "If You Observe a Hazard", "paragraphs": ["Stop the job and address the hazardous condition. Do not continue working while \u201ckeeping an eye\u201d on something that looks unsafe, and do not simply document it for later review \u2014 halt the work."]}, {"heading": "In a Fire Emergency", "paragraphs": ["a.\tActivate the fire alarm.", "b.\tNotify your immediate supervisor, people in the vicinity, and plant operations.", "c.\tAttempt to extinguish the fire only if it is safe and within the capability of the extinguisher on hand \u2014 do not put yourself at risk."]}, {"heading": "Fire and Safety Permit", "paragraphs": ["Adhere to every condition and requirement listed on the job's Fire and Safety Permit \u2014 it exists to ensure safety protocols are actually followed, not just to satisfy paperwork."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What is the primary responsibility of a Fire Watch?", "options": ["Operating heavy machinery", "Managing the construction schedule", "Preventing ignition of flammable materials", "Ensuring workers have safety gear"], "answer": "C", "explain": "The Fire Watch's core job is preventing hot work from starting a fire, and catching it immediately if one does."}, {"num": 2, "type": "Multiple Choice", "stem": "In a fire emergency, what should a Fire Watch do first?", "options": ["Activate the fire alarm", "Wait to see if it spreads", "Attempt to extinguish the fire", "Leave the area immediately without telling anyone"], "answer": "A", "explain": "Activating the alarm gets help moving immediately, before anything else."}, {"num": 3, "type": "Multiple Choice", "stem": "What should a Fire Watch do if they observe a hazardous condition during their duties?", "options": ["Report it to a colleague only", "Continue working while keeping an eye on it", "Stop the job and address the hazardous condition", "Document it for later review"], "answer": "C", "explain": "A hazardous condition means stopping the job right then, not monitoring it or filing it away for later."}, {"num": 4, "type": "Multiple Choice", "stem": "What must a Fire Watch do before starting work?", "options": ["Nothing special is required", "Only check in with a coworker", "Obtain a suitable fire extinguisher and keep it close to the job site", "Wait for a hazard to appear before preparing"], "answer": "C", "explain": "Having the right extinguisher on hand, ready to go, is a baseline requirement before hot work starts."}, {"num": 5, "type": "Multiple Choice", "stem": "If a Fire Watch must leave the job site temporarily during welding operations, what must happen?", "options": ["Stop the job or have another qualified Fire Watch take over first", "Leave without notifying anyone", "Ask a colleague informally to keep an eye out", "Continue monitoring remotely by phone"], "answer": "A", "explain": "Hot work is never left unwatched \u2014 either the work stops, or a qualified replacement Fire Watch takes over before the original one leaves."}, {"num": 6, "type": "Multiple Choice", "stem": "Why does a Fire Watch survey the area for flammable liquids or vapors before and during work?", "options": ["To check on other crews' progress", "To find a place to take breaks", "To prevent accidents and fires due to hazardous substances", "To plan waste disposal"], "answer": "C", "explain": "This survey is specifically about catching flammable hazards before hot work can ignite them."}, {"num": 7, "type": "Multiple Choice", "stem": "What should a Fire Watch do upon encountering a flammable liquid situation during welding operations?", "options": ["Stop welding operations and follow the shutdown procedure", "Immediately notify the supervisor only, without stopping work", "Continue working and report it later", "Ignore it since it's not their responsibility"], "answer": "A", "explain": "The work stops and welding equipment is shut down per procedure \u2014 notifying a supervisor doesn't substitute for actually halting the hazard."}, {"num": 8, "type": "Multiple Choice", "stem": "If a Fire Watch has questions about their duties, what should they do?", "options": ["Discuss concerns with the supervisor or Health and Safety department", "Check informally with colleagues", "Wait until after the job to ask", "Proceed as best they can without asking"], "answer": "A", "explain": "Questions get resolved with a supervisor or Health and Safety before work begins \u2014 not guessed at."}, {"num": 9, "type": "Multiple Choice", "stem": "What must a Fire Watch adhere to throughout the job?", "options": ["The fastest way to finish the job", "The conditions and requirements on the Fire and Safety Permit", "Whatever the crew prefers", "Only their own judgment"], "answer": "B", "explain": "The permit's conditions exist specifically to keep the job safe \u2014 they aren't optional paperwork."}, {"num": 10, "type": "Multiple Choice", "stem": "What is the ultimate goal of the Fire Watch role?", "options": ["Organizing schedules", "Completing work as quickly as possible", "Assisting with administrative tasks", "Preventing fires and ensuring safety"], "answer": "D", "explain": "Everything a Fire Watch does serves one goal: preventing a fire and keeping everyone on site safe."}], "has_checklist": false, "name": "Fire Watch", "category": "Hot Work & Trade Safety"}, {"file": "LSFabco_Scaffold_Training.docx", "title": "Scaffold", "sections": [{"heading": null, "paragraphs": ["Scaffolds are temporary structures that support workers and materials during construction, maintenance, or repair. Improper setup or use is one of the more common sources of serious falls, so setup, inspection, and load limits all matter."]}, {"heading": "Inspection", "paragraphs": ["a.\tA competent person must inspect the scaffold before each work shift, and after any event that could affect its structural integrity (heavy rain, wind, seismic activity, or impact).", "b.\tConfirm all components \u2014 platforms, guardrails, braces, base plates \u2014 are in good condition before use."]}, {"heading": "Setup", "paragraphs": ["a.\tOnly trained and authorized personnel may erect, dismantle, or move a scaffold, following the manufacturer's guidelines and Cal/OSHA requirements.", "b.\tScaffolds must be supported on solid footing \u2014 base plates, screw jacks, and mudsills on stable ground. Never support a scaffold on unstable objects like barrels or boxes.", "c.\tAccess the platform by an attached ladder or built-in access \u2014 never climb the cross-bracing."]}, {"heading": "Fall Protection", "paragraphs": ["Cal/OSHA's fall protection trigger height for scaffolds is lower than many national materials describe: guardrails and toeboards are required on all open sides and ends at 7\u00bd feet or more above the level below (Title 8 \u00a71621) \u2014 not the 10-foot threshold commonly cited for federal OSHA.", "a.\tGuardrails, mid-rails, and toeboards are installed on all open sides and ends of the scaffold platform.", "b.\tCal/OSHA sets top rail height between 42 and 45 inches above the platform surface (Title 8 \u00a73209) \u2014 slightly narrower than the federal range.", "c.\tPersonal fall protection equipment (harness and lanyard) is worn when required by the specific scaffold type or task."]}, {"heading": "Load Limits", "paragraphs": ["a.\tA scaffold must be designed and built to support its own weight plus at least four times the maximum intended load \u2014 a 4:1 safety factor.", "b.\tNever exceed the scaffold's rated capacity once workers, tools, and materials are all accounted for."]}, {"heading": "Working Safely on a Scaffold", "paragraphs": ["a.\tNever climb cross-bracing or use a ladder set up on the scaffold platform to gain extra height.", "b.\tDon't overload platforms with excess material \u2014 keep only what's needed for the task at hand.", "c.\tKeep the work area free of debris and tools underfoot to prevent trips.", "d.\tUse a tie line to control any materials being hoisted up to the platform \u2014 never toss materials up or down."]}, {"heading": "Training", "paragraphs": ["Everyone who uses a scaffold receives training on its specific hazards, inspection requirements, and safe use before working on one. Communication between workers, supervisors, and the competent person keeps setup and use safe as conditions change."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "When must a scaffold be inspected?", "options": ["Only if it looks damaged", "Before each work shift and after any event affecting its integrity", "Once a month regardless of use", "Only at the end of the job"], "answer": "B", "explain": "A competent person inspects before each shift and after any event \u2014 weather, impact, seismic activity \u2014 that could affect structural integrity."}, {"num": 2, "type": "Multiple Choice", "stem": "At what height does Cal/OSHA require guardrails/fall protection on a scaffold?", "options": ["15 feet", "10 feet", "6 feet", "7\u00bd feet"], "answer": "D", "explain": "Title 8 \u00a71621 sets California's guardrail trigger at 7\u00bd feet \u2014 lower than the 10-foot threshold often cited for federal OSHA scaffolds."}, {"num": 3, "type": "Multiple Choice", "stem": "What is Cal/OSHA's required top rail height range for scaffold guardrails?", "options": ["36\u201339 inches", "48\u201352 inches", "30\u201336 inches", "42\u201345 inches"], "answer": "D", "explain": "Title 8 \u00a73209 requires the top rail between 42 and 45 inches above the platform surface."}, {"num": 4, "type": "Multiple Choice", "stem": "Who may erect, dismantle, or move a scaffold?", "options": ["Only trained and authorized personnel", "Any available worker", "Any employee willing to help", "Project managers only"], "answer": "A", "explain": "Scaffold assembly and disassembly requires specific training and authorization, not general willingness."}, {"num": 5, "type": "Multiple Choice", "stem": "What should a scaffold be supported on?", "options": ["Whatever is available on site", "Base plates, screw jacks, and mudsills on stable ground", "Uneven surfaces", "Barrels or boxes"], "answer": "B", "explain": "Proper footing prevents settling or collapse \u2014 unstable objects like barrels or boxes are never an acceptable base."}, {"num": 6, "type": "Multiple Choice", "stem": "What safety factor must a scaffold's load capacity meet?", "options": ["Twice the intended load only", "Its own weight only", "Its own weight plus at least 4 times the maximum intended load", "Its own weight plus half the intended load"], "answer": "C", "explain": "Scaffolds are engineered to support their own weight plus at least four times the maximum intended load."}, {"num": 7, "type": "Multiple Choice", "stem": "How should a worker access a scaffold platform?", "options": ["By being lifted up", "Any way that's convenient", "By climbing the cross-bracing", "By an attached ladder or built-in access"], "answer": "D", "explain": "Cross-bracing is not designed as a climbing structure \u2014 use the ladder or access point the scaffold provides."}, {"num": 8, "type": "Multiple Choice", "stem": "How should materials be moved up to a scaffold platform?", "options": ["However is fastest", "Using a tie line to control the load", "Tossed up by hand", "Dropped down when done"], "answer": "B", "explain": "A tie line keeps hoisted materials controlled, protecting both the person hoisting and anyone below."}, {"num": 9, "type": "True/False", "stem": "It's acceptable to use a ladder set up on the scaffold platform to reach a bit higher.", "options": [], "answer": "False", "explain": "Never use a ladder (or climb cross-bracing) on a scaffold platform to gain extra height \u2014 it defeats the platform's stability and rated capacity."}, {"num": 10, "type": "Multiple Choice", "stem": "What is essential for safe scaffold operations as conditions change?", "options": ["Ignoring minor changes", "Only the competent person needs to know anything", "Communication between workers, supervisors, and the competent person", "Working in silence to avoid distraction"], "answer": "C", "explain": "Ongoing communication ensures new hazards or changes get addressed instead of assumed away."}], "has_checklist": false, "name": "Scaffold", "category": "Hot Work & Trade Safety"}, {"file": "LSFabco_Ladder_Safety_Training.docx", "title": "Ladder Safety", "sections": [{"heading": null, "paragraphs": ["All employees who use ladders must understand safe setup, use, and inspection procedures. Most ladder incidents come from a handful of preventable mistakes: skipping inspection, using the wrong angle, or standing somewhere the ladder wasn't designed for."]}, {"heading": "Inspection", "paragraphs": ["a.\tInspect ladders before each use for cracks, corros
