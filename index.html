rating assumes proper sizing and wear."}, {"num": 6, "type": "True/False", "stem": "A single type of glove provides adequate protection against all hand hazards.", "options": [], "answer": "False", "explain": "Gloves must be matched to the specific hazard \u2014 cut resistance, chemical resistance, and thermal protection are different properties, and no glove covers everything."}, {"num": 7, "type": "Multiple Choice", "stem": "Before using a respirator, what must an employee complete?", "options": ["A written essay on respirator history", "Only a vision test", "Medical evaluation and fit testing", "Nothing extra beyond general PPE training"], "answer": "C", "explain": "Respiratory protection has its own medical evaluation and fit-testing requirements before use, beyond general PPE training."}, {"num": 8, "type": "Multiple Choice", "stem": "What should employees be trained on regarding their PPE?", "options": ["Nothing \u2014 PPE is self-explanatory", "When and what PPE is necessary, proper use, limitations, care, maintenance, and disposal", "Only the manufacturer's brand name", "Only how to put it on"], "answer": "B", "explain": "PPE training covers the full picture: when it's needed, how to use it correctly, its limitations, and how to maintain and dispose of it."}, {"num": 9, "type": "True/False", "stem": "PPE use eliminates the need to follow safe work practices for the underlying hazard.", "options": [], "answer": "False", "explain": "PPE supplements safe work practices \u2014 it doesn't replace hazard awareness and safe procedures."}, {"num": 10, "type": "Multiple Choice", "stem": "Employees must demonstrate what before performing work that requires PPE?", "options": ["Prior work experience elsewhere", "Nothing \u2014 training alone is sufficient", "An understanding of the training and the ability to use the PPE properly", "A written exam score of 100%"], "answer": "C", "explain": "Employees must show both understanding of the training and practical ability to use the PPE correctly before being cleared to work with it."}], "has_checklist": false, "name": "PPE", "category": "General Safety & Compliance"}, {"file": "LSFabco_Hazard_Communication_Training.docx", "title": "Hazard Communication", "sections": [{"heading": null, "paragraphs": ["Our hazard communication program aligns with the United Nations Globally Harmonized System of Classification and Labeling of Chemicals (GHS). It ensures employees know what hazardous chemicals are present, how to read the information provided about them, and how to work with them safely."]}, {"heading": "Scope", "paragraphs": ["Hazard communication applies to any hazardous chemical present in the workplace that could expose employees under normal conditions of use or in a foreseeable emergency."]}, {"heading": "Identifying Hazardous Chemicals", "paragraphs": ["a.\tA list of hazardous chemicals present in the workplace is maintained, referenced by the identity shown on each chemical's Safety Data Sheet (SDS).", "b.\tThis list covers the entire workplace, or can be organized by specific work area."]}, {"heading": "Labels", "paragraphs": ["a.\tAll hazardous chemicals arriving on-site, whether from a supplier or transferred into a secondary container, must be properly labeled with the required GHS elements: product identifier, signal word, hazard statement(s), pictogram(s), and precautionary statement(s).", "b.\tDo not use a container of hazardous chemical whose label is missing, illegible, or doesn't match the SDS on file."]}, {"heading": "Safety Data Sheets (SDS)", "paragraphs": ["a.\tSDSs provide comprehensive information on a chemical's hazards, safe handling, storage, and emergency response, and must be readily accessible to employees during every shift.", "b.\tWhen a new or revised SDS is received, the updated information is provided to employees on a timely basis \u2014 promptly if the new information shows an increased risk."]}, {"heading": "Non-Routine Tasks", "paragraphs": ["Before performing a non-routine task involving hazardous chemicals (for example, cleaning inside a vessel or tank), employees receive specific information from a competent person or project management covering:", "a.\tThe specific chemical hazards involved.", "b.\tRequired protective/safety measures.", "c.\tMeasures taken to minimize hazards \u2014 ventilation, respirators, the presence of another employee, and emergency procedures."]}, {"heading": "Training", "paragraphs": ["Employees receive hazard communication training on initial assignment, and whenever a new chemical hazard is introduced into their work area. Training covers how to read labels and SDSs, the hazards of chemicals in the work area, and the protective measures in place."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What international system does our hazard communication program align with?", "options": ["GHS", "EPA", "ISO", "ANSI"], "answer": "A", "explain": "Our program follows the UN Globally Harmonized System of Classification and Labeling of Chemicals (GHS)."}, {"num": 2, "type": "Multiple Choice", "stem": "When does hazard communication apply to a hazardous chemical?", "options": ["Only if it's flammable", "When it's present under normal conditions of use or in a foreseeable emergency", "Only during emergencies", "Only when locked in storage"], "answer": "B", "explain": "Coverage isn't limited to emergencies \u2014 it applies whenever normal use or a foreseeable emergency could expose employees."}, {"num": 3, "type": "Multiple Choice", "stem": "How is the workplace list of hazardous chemicals organized?", "options": ["By purchase date only", "Alphabetically by employee name", "It isn't maintained", "Referenced by the identity shown on each chemical's SDS"], "answer": "D", "explain": "The chemical list ties directly back to each item's Safety Data Sheet identity, keeping the two documents consistent."}, {"num": 4, "type": "Multiple Choice", "stem": "Which of these is a required GHS label element?", "options": ["Signal word and pictogram(s)", "Purchase price", "Delivery date", "Employee's name"], "answer": "A", "explain": "GHS labels require a product identifier, signal word, hazard statement(s), pictogram(s), and precautionary statement(s)."}, {"num": 5, "type": "True/False", "stem": "It's acceptable to use a container of hazardous chemical if its label has become illegible, as long as you remember what it is.", "options": [], "answer": "False", "explain": "An illegible, missing, or mismatched label means the container should not be used until it's properly relabeled."}, {"num": 6, "type": "Multiple Choice", "stem": "What must be done when a new or revised SDS is received showing increased risk to employees?", "options": ["Nothing, unless requested", "Wait for the next scheduled training", "Provide the updated information to employees promptly", "File it away for later"], "answer": "C", "explain": "Increased-risk information from an updated SDS must be passed to employees promptly, not held until a routine training cycle."}, {"num": 7, "type": "Multiple Choice", "stem": "Before a non-routine task like cleaning inside a vessel, what must employees receive?", "options": ["Only a verbal \u201cbe careful\u201d reminder", "A copy of the company handbook", "Specific information on the chemical hazards, required protective measures, and hazard-reduction steps", "Nothing extra beyond standard training"], "answer": "C", "explain": "Non-routine tasks get task-specific hazard communication, not just general awareness training."}, {"num": 8, "type": "Multiple Choice", "stem": "When must hazard communication training be provided?", "options": ["On initial assignment and whenever a new chemical hazard is introduced", "Every five years regardless of changes", "Only if requested by the employee", "Only once, at hire"], "answer": "A", "explain": "Training happens at initial assignment and again whenever a new chemical hazard enters the work area."}, {"num": 9, "type": "Multiple Choice", "stem": "Where should Safety Data Sheets be accessible to employees?", "options": ["Only available by written request", "Only at the corporate office", "Locked in a manager's office", "Readily accessible during every shift"], "answer": "D", "explain": "SDSs need to be accessible to employees during their shift, not gated behind a request process."}, {"num": 10, "type": "Multiple Choice", "stem": "What is the main goal of the hazard communication program?", "options": ["To restrict information from employees", "To create administrative paperwork", "To ensure employees understand chemical hazards and how to work safely with them", "To comply with a specific country's law only"], "answer": "C", "explain": "The point of the whole program is that employees actually understand the hazards and protective measures \u2014 not just that paperwork exists."}], "has_checklist": false, "name": "Hazard Communication", "category": "General Safety & Compliance"}, {"file": "LSFabco_Electrical_Safety_Training.docx", "title": "Electrical Safety", "sections": [{"heading": null, "paragraphs": ["Electrical work must be performed with the assumption that every circuit is energized until proven otherwise. This training covers who may perform electrical work, how equipment is de-energized safely, and the everyday precautions that prevent shock, arc flash, and fire."]}, {"heading": "Qualified Persons", "paragraphs": ["a.\tOnly a qualified person \u2014 someone trained and knowledgeable in the construction and operation of the equipment, and trained to recognize and avoid the electrical hazards involved \u2014 may work on or near exposed energized parts.", "b.\tUnqualified individuals may only work under the direct supervision of a qualified person, and never on exposed energized parts.", "c.\tAll electrical work must follow the National Electrical Code and applicable local codes."]}, {"heading": "De-Energized Work Is the Default", "paragraphs": ["a.\tEquipment is de-energized, locked out, and tagged (see the separate Lockout/Tagout training) before work begins, unless de-energizing introduces a greater hazard or is infeasible.", "b.\tEnergized work is the exception, not the routine \u2014 it requires a qualified person, a documented justification, and the specific PPE and tools rated for the task.", "c.\tLocks and tags on electrical disconnects are removed only by the authorized person who applied them, or per the documented exception procedure."]}, {"heading": "Approach Boundaries", "paragraphs": ["Working near exposed energized parts involves defined approach boundaries (limited, restricted, and prohibited) that depend on voltage \u2014 the higher the voltage, the greater the required distance. These distances are determined by a qualified person or an arc flash/shock risk assessment for the specific equipment and voltage involved; do not assume a distance without checking the equipment's documentation or site electrical safety program."]}, {"heading": "Everyday Electrical Precautions", "paragraphs": ["a.\tInspect electrical tools, cords, and equipment daily; tag and remove defective items from service immediately.", "b.\tElectrical tools and equipment must be grounded, except for tools that are double-insulated.", "c.\tGFCI (ground-fault circuit interrupter) protection is required for temporary power and receptacles used by personnel on our job sites.", "d.\tKeep extension cords and temporary wiring out of walkways, or cover them to eliminate a tripping hazard.", "e.\tKeep hands dry when working with electrical equipment, including plugging in cords.", "f.\tAdequate lighting is required wherever electrical work is performed."]}, {"heading": "Overhead Power Lines", "paragraphs": ["Maintain a minimum clearance from overhead power lines \u2014 commonly at least 10 feet for lines up to 50kV, with greater clearance required at higher voltages. Confirm the actual voltage and required clearance with the utility or a qualified pe ", "options": ["Steel", "Non-conductive", "Aluminum", "Chrome-plated"], "answer": "B", "explain": "Non-conductive siderails prevent the ladder itself from becoming a path for electrical current."}, {"num": 10, "type": "Multiple Choice", "stem": "What should be done with a damaged extension cord found during a daily inspection?", "options": ["Wrap it in tape and keep using it", "Use it only for low-power tools", "Tag it and remove it from service immediately", "Ignore it if it still works"], "answer": "C", "explain": "A damaged cord is a shock and fire hazard and must come out of service right away, not get a workaround."}], "has_checklist": false, "name": "Electrical Safety", "category": "General Safety & Compliance"}, {"file": "LSFabco_Harassment_Discrimination_Training.docx", "title": "Harassment Discrimination", "sections": [{"heading": null, "paragraphs": ["Every employee has the right to work in an environment free from discrimination and harassment. This isn't just company policy \u2014 California law (the Fair Employment and Housing Act, and Government Code \u00a712950.1) requires employers with five or more employees to provide this training, and requires it be genuinely interactive, not just a document to sign."]}, {"heading": "California's Training Requirement", "paragraphs": ["a.\tSupervisory employees receive at least 2 hours of interactive training; non-supervisory employees receive at least 1 hour.", "b.\tTraining is provided within 6 months of hire or promotion into a supervisory role, and at least once every 2 years after that.", "c.\tSeasonal or temporary employees hired for less than 6 months are trained within 30 calendar days or 100 hours worked, whichever comes first.", "d.\tThis training is administered under guidance from California's Civil Rights Department (CRD)."]}, {"heading": "What's Prohibited", "paragraphs": ["Harassment on the basis of race, color, creed, ancestry, national origin, age (40 and over), disability, sex, arrest or convicti <script>
const MODULES = JSON.parse(document.getElementById('modules-data').textContent);
const CATEGORIES = ["Powered Equipment", "Hot Work & Trade Safety", "Exposure & Health", "General Safety & Compliance"];
const PASS_THRESHOLD = 0.8;

// Paste the Google Apps Script "Web app URL" here after deploying lsfabco_apps_script.gs.
// Until this is set, completions still save locally on-device, but nothing reaches your Sheet.
const SUBMIT_URL = "https://script.google.com/macros/s/AKfycbzjwdZAG1UU-UatzmEwZ4VQqv88W2rE6Jw216AiJEYAxJWgsr8a82SCJXOca3YXuuNSmg/exec";

const LOCAL_KEY = 'lsf_local_completions';

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function loadLocalCompletions() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]'); } catch (e) { return []; }
}
function saveLocalCompletion(record) {
  const all = loadLocalCompletions();
  all.unshift(record);
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(all.slice(0, 500))); } catch (e) { /* storage full or unavailable */ }
}

const state = {
  view: 'gate',
  employeeName: localStorage.getItem('lsf_employee_name') || '',
  moduleIdx: null,
  quizIdx: 0,
  answers: [],
  submitting: false,
  submitError: false,
  trainerName: '',
  certName: '',
  certChecked: false,
};

function myLocalCompletions() {
  if (!state.employeeName) return [];
  return loadLocalCompletions().filter(c => (c.employeeName || '').toLowerCase() === state.employeeName.toLowerCase());
}

function statusFor(moduleName) {
  const mine = myLocalCompletions().filter(c => c.moduleName === moduleName);
  if (!mine.length) return null;
  mine.sort((a, b) => (b.timestamp || '').localeCompare(a.timestamp || ''));
  return mine[0];
}

function setView(v) { state.view = v; render(); window.scrollTo(0, 0); }

// ---------------------------------------------------------------- content rendering
function renderParagraphs(paras) {
  let html = '';
  let i = 0;
  while (i < paras.length) {
    const p = paras[i];
    const letterMatch = p.match(/^([a-h])\.\t([\s\S]*)$/);
    const checkMatch = p.match(/^\u2610\t([\s\S]*)$/);
    const noteMatch = p.match(/^Note:\t([\s\S]*)$/);
    if (letterMatch) {
      const items = [];
      while (i < paras.length) {
        const m = paras[i].match(/^([a-h])\.\t([\s\S]*)$/);
        if (!m) break;
        items.push(m[2]);
        i++;
      }
      html += '<ol class="lettered">' + items.map(it => `<li>${esc(it)}</li>`).join('') + '</ol>';
      continue;
    }
    if (checkMatch) {
      const items = [];
      while (i < paras.length) {
        const m = paras[i].match(/^\u2610\t([\s\S]*)$/);
        if (!m) break;
        items.push(m[1]);
        i++;
      }
      html += '<ul class="checklist">' + items.map(it => `<li>${esc(it)}</li>`).join('') + '</ul>';
      continue;
    }
    if (noteMatch) {
      html += `<div class="note"><strong>Note:</strong> ${esc(noteMatch[1])}</div>`;
      i++;
      continue;
    }
    html += `<p>${esc(p)}</p>`;
    i++;
  }
  return html;
}

function renderModuleContent(mod) {
  return mod.sections.map(s => {
    let h = '<div class="sec">';
    if (s.heading) h += `<h3>${esc(s.heading)}</h3>`;
    h += renderParagraphs(s.paragraphs);
    h += '</div>';
    return h;
  }).join('');
}

// ---------------------------------------------------------------- views
function viewGate() {
  return `
    <div class="name-gate">
      <h1>L&amp;S Fabco Safety Training</h1>
      <p>Enter your name to start or continue a training module on your phone.</p>
      <input type="text" id="nameInput" placeholder="Full name" value="${esc(state.employeeName)}" autocomplete="name">
      <button class="btn" id="continueBtn">Continue</button>
    </div>`;
}

function pillFor(status) {
  if (!status) return '<span class="pill none">Not started</span>';
  if (status.passed) return '<span class="pill current">Passed \u00b7 ' + status.score + '/' + status.total + '</span>';
  return '<span class="pill retrain">Needs retraining</span>';
}

function viewHome() {
  let cats = CATEGORIES.map(cat => {
    const mods = MODULES.filter(m => m.category === cat);
    const rows = mods.map((m) => {
      const globalIdx = MODULES.indexOf(m);
      const status = statusFor(m.name);
      return `
        <button class="module-row" data-modidx="${globalIdx}">
          <div style="flex:1">
            <div class="title">${esc(m.name)}</div>
            <div class="meta">${m.questions.length} questions${m.has_checklist ? ' \u00b7 equipment checklist required' : ''}</div>
          </div>
          ${pillFor(status)}
          <span class="chevron">\u203a</span>
        </button>`;
    }).join('');
    return `<div class="category"><h2>${esc(cat)}</h2>${rows}</div>`;
  }).join('');
  return `<div class="content">${cats}</div>`;
}

function viewModule() {
  const m = MODULES[state.moduleIdx];
  const checklistNote = m.has_checklist ? `
    <div class="checklist-banner">
      <strong>Before independent operation:</strong> a competent person must also complete the printed
      ${esc(m.name)} Competent Person Checklist while observing you operate the equipment. This quiz covers
      the knowledge portion only.
    </div>` : '';
  return `
    <div class="content">
      <div class="back-row"><button class="back-btn" id="backHome">\u2039 All Trainings</button></div>
      <h1 class="module-title">${esc(m.name)}</h1>
      <div class="module-sub">${m.category} \u00b7 ${m.questions.length} question quiz</div>
      ${renderModuleContent(m)}
      ${checklistNote}
      <button class="btn" id="startQuiz">Start Quiz (${m.questions.length} questions)</button>
    </div>`;
}

function viewQuiz() {
  const m = MODULES[state.moduleIdx];
  const q = m.questions[state.quizIdx];
  const pct = Math.round((state.quizIdx) / m.questions.length * 100);
  const selected = state.answers[state.quizIdx];
  const isTF = q.type === 'True/False';
  const opts = isTF ? ['True', 'False'] : q.options;
  const optHtml = opts.map((opt, i) => {
    const val = isTF ? opt : 'ABCD'[i];
    const isSel = selected === val;
    return `<button class="opt${isSel ? ' selected' : ''}" data-val="${esc(val)}">${isTF ? '' : (val + '. ')}${esc(opt)}</button>`;
  }).join('');
  const isLast = state.quizIdx === m.questions.length - 1;
  return `
    <div class="content">
      <div class="back-row"><button class="back-btn" id="backModule">\u2039 Exit Quiz</button></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="q-count">Question ${state.quizIdx + 1} of ${m.questions.length}</div>
      <div class="q-stem">${esc(q.stem)}</div>
      ${optHtml}
      <div class="nav-row">
        ${state.quizIdx > 0 ? '<button class="btn secondary" id="prevQ">Back</button>' : ''}
        <button class="btn" id="nextQ" ${selected == null ? 'disabled' : ''}>${isLast ? 'See Results' : 'Next'}</button>
      </div>
    </div>`;
}

function scoreQuiz() {
  const m = MODULES[state.moduleIdx];
  let correct = 0;
  const review = m.questions.map((q, i) => {
    const given = state.answers[i];
    const isRight = (given || '').toUpperCase() === (q.answer || '').toUpperCase();
    if (isRight) correct++;
    return { q, given, isRight };
  });
  return { correct, total: m.questions.length, review };
}

function viewResult() {
  const m = MODULES[state.moduleIdx];
  const { correct, total, review } = scoreQuiz();
  const pct = Math.round((correct / total) * 100);
  const passed = (correct / total) >= PASS_THRESHOLD;
  const reviewHtml = review.map((r, i) => `
    <div class="review-item ${r.isRight ? 'right' : 'wrong'}">
      <div class="stem">${i + 1}. ${esc(r.q.stem)}</div>
      <div class="your-answer">Your answer: ${esc(r.given || '\u2014')} ${r.isRight ? '\u2713 Correct' : '\u2717 Incorrect (correct: ' + esc(r.q.answer) + ')'}</div>
      <div class="explain">${esc(r.q.explain)}</div>
    </div>`).join('');

  const errorNote = state.submitError ? `
    <div class="note" style="border-left-color:var(--red); background:var(--red-tint);">
      Your result is saved on this phone, but couldn't reach the company record right now
      (no signal, or the connection isn't set up yet). Try again later, or let your supervisor know.
    </div>` : '';

  const signoffHtml = `
    <div class="sec">
      <h3>Certify Completion</h3>
      <label class="field-label">Your Full Name (for the record)</label>
      <input type="text" id="certName" value="${esc(state.certName || state.employeeName)}">
      <label class="field-label">Trainer / Supervisor (optional)</label>
      <input type="text" id="trainerName" value="${esc(state.trainerName)}" placeholder="Who assigned or oversaw this training">
      <div class="check-row">
        <input type="checkbox" id="certCheck" ${state.certChecked ? 'checked' : ''}>
        <label for="certCheck">I certify that I completed this training and answered the quiz questions myself, without assistance.</label>
      </div>
      ${errorNote}
      <button class="btn" id="submitCert" ${state.submitting ? 'disabled' : ''}>${state.submitting ? 'Saving\u2026' : 'Submit & Save Record'}</button>
    </div>`;

  return `
    <div class="content">
      <div class="back-row"><button class="back-btn" id="backHomeFromResult">\u2039 All Trainings</button></div>
      <div class="score-hero">
        <div class="score-num">${pct}%</div>
        <div class="score-label">${correct} of ${total} correct \u2014 ${esc(m.name)}</div>
        <div class="verdict ${passed ? 'pass' : 'retrain'}">${passed ? 'Passing score' : 'Needs retraining'}</div>
      </div>
      ${signoffHtml}
      <h3 style="margin-top:22px;">Review</h3>
      ${reviewHtml}
      <button class="btn secondary" id="retakeBtn">Retake Quiz</button>
    </div>`;
}

// ---------------------------------------------------------------- render + wire-up
function render() {
  const app = document.getElementById('app');
  let bodyHtml = '';
  if (state.view === 'gate') {
    bodyHtml = viewGate();
  } else {
    const topbar = `
      <div class="topbar">
        <div class="mark">LS<span>FABCO</span> Training</div>
        <div class="who">
          ${esc(state.employeeName)}
          <br><button class="link" id="switchUser">Not you?</button>
        </div>
      </div>`;
    let view = '';
    if (state.view === 'home') view = viewHome();
    else if (state.view === 'module') view = viewModule();
    else if (state.view === 'quiz') view = viewQuiz();
    else if (state.view === 'result') view = viewResult();
    bodyHtml = topbar + view;
  }
  app.innerHTML = bodyHtml;
  wireEvents();
}

function wireEvents() {
  if (state.view === 'gate') {
    const btn = document.getElementById('continueBtn');
    const inp = document.getElementById('nameInput');
    const go = () => {
      const v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      state.employeeName = v;
      localStorage.setItem('lsf_employee_name', v);
      setView('home');
    };
    btn.addEventListener('click', go);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return;
  }

  const switchUser = document.getElementById('switchUser');
  if (switchUser) switchUser.addEventListener('click', () => setView('gate'));

  if (state.view === 'home') {
    document.querySelectorAll('.module-row').forEach(el => {
      el.addEventListener('click', () => {
        state.moduleIdx = parseInt(el.dataset.modidx, 10);
        setView('module');
      });
    });
  } else if (state.view === 'module') {
    document.getElementById('backHome').addEventListener('click', () => setView('home'));
    document.getElementById('startQuiz').addEventListener('click', () => {
      state.quizIdx = 0;
      state.answers = [];
      setView('quiz');
    });
  } else if (state.view === 'quiz') {
    document.getElementById('backModule').addEventListener('click', () => setView('module'));
    document.querySelectorAll('.opt').forEach(el => {
      el.addEventListener('click', () => {
        state.answers[state.quizIdx] = el.dataset.val;
        render();
      });
    });
    const prev = document.getElementById('prevQ');
    if (prev) prev.addEventListener('click', () => { state.quizIdx--; render(); });
    document.getElementById('nextQ').addEventListener('click', () => {
      const m = MODULES[state.moduleIdx];
      if (state.quizIdx < m.questions.length - 1) { state.quizIdx++; render(); }
      else { setView('result'); }
    });
  } else if (state.view === 'result') {
    document.getElementById('backHomeFromResult').addEventListener('click', () => setView('home'));
    document.getElementById('retakeBtn').addEventListener('click', () => {
      state.quizIdx = 0; state.answers = []; setView('quiz');
    });
    const certInput = document.getElementById('certName');
    const trainerInput = document.getElementById('trainerName');
    const certCheck = document.getElementById('certCheck');
    certInput.addEventListener('input', () => { state.certName = certInput.value; });
    trainerInput.addEventListener('input', () => { state.trainerName = trainerInput.value; });
    certCheck.addEventListener('change', () => { state.certChecked = certCheck.checked; });
    document.getElementById('submitCert').addEventListener('click', async () => {
      if (!certCheck.checked || !certInput.value.trim()) {
        alert('Please type your name and check the certification box before submitting.');
        return;
      }
      state.submitting = true; state.submitError = false; render();
      const { correct, total } = scoreQuiz();
      const m = MODULES[state.moduleIdx];
      const record = {
        employeeName: state.employeeName,
        moduleName: m.name,
        category: m.category,
        score: correct,
        total,
        passed: (correct / total) >= PASS_THRESHOLD,
        certifiedName: certInput.value.trim(),
        trainerName: trainerInput.value.trim(),
        timestamp: new Date().toISOString(),
      };
      // Always keep the local, per-device copy so this phone's status pills stay accurate
      // even if the network call below fails or isn't configured yet.
      saveLocalCompletion(record);

      if (SUBMIT_URL && SUBMIT_URL.indexOf('PASTE_YOUR') !== 0) {
        try {
          await fetch(SUBMIT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(record),
          });
        } catch (e) {
          state.submitError = true;
        }
      }
      state.submitting = false;
      setView('home');
    });
  }
}

render();

</script>
</body>
</html>
