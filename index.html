ion, loose rungs, and damaged feet.", "b.\tTag defective ladders and remove them from service immediately \u2014 do not attempt a field repair and continue using it.", "c.\tNever cover ANSI or manufacturer approval labels with paint or tape."]}, {"heading": "Setup & Positioning", "paragraphs": ["a.\tA stairway or ladder must be provided at any point of access with a break in elevation of 19 inches or more, where no ramp, runway, or personnel hoist is provided.", "b.\tSet non-self-supporting ladders at the correct angle: the base should sit out about one-quarter of the ladder's working length from the wall (a 4:1 ratio).", "c.\tUse ladders only on stable, level surfaces, or secure them (tie-off, stake, or have someone foot the ladder) if the surface is uneven or slippery.", "d.\tRungs, cleats, and steps must be level and uniformly spaced when the ladder is in use \u2014 never rest a ladder at an angle that distorts this.", "e.\tPortable ladders used to access an upper landing must extend at least 3 feet above the landing surface, or be secured at the top."]}, {"heading": "Safe Use", "paragraphs": ["a.\tFace the ladder when climbing up or down, and maintain three points of contact.", "b.\tNever carry objects that could cause a loss of balance \u2014 use a tool belt or have materials hauled up separately.", "c.\tNever stand on the top step of a stepladder \u2014 it is not designed to bear weight.", "d.\tDo not move, shift, or extend a ladder while someone is on it.", "e.\tKeep the area around the top and bottom of the ladder clear of obstructions."]}, {"heading": "Fixed Ladders (24 Feet and Over)", "paragraphs": ["Fixed ladders extending more than 24 feet above a lower level have their own fall protection requirements, and the rule has changed over time:", "a.\tFixed ladders installed on or after November 19, 2018 must have a personal fall arrest system (PFAS) or ladder safety system \u2014 a cage or well alone is not sufficient.", "b.\tFixed ladders installed before that date may keep an existing cage or well, but if any section is replaced or modified, that section must be brought up to the PFAS/ladder safety system standard.", "Note:\tAs of this writing, OSHA's rule sets a final deadline of November 18, 2036 for all fixed ladders over 24 feet to have a PFAS or ladder safety system, regardless of install date. However, OSHA published a proposed rule in April 2026 to remove that 2036 deadline and let cages/wells remain acceptable indefinitely on existing ladders; that proposal was still working through public comment and hearings as of mid-2026 and had not taken effect. Treat the 2036 deadline as still in force until a final rule says otherwise, and check for updates before budgeting any related retrofit."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What should be done with a ladder found to have a defect during inspection?", "options": ["Use it only for light tasks", "Paint over the defect", "Tag it as defective and remove it from service", "Keep using it carefully"], "answer": "C", "explain": "A defective ladder comes out of service immediately \u2014 it doesn't get a workaround."}, {"num": 2, "type": "Multiple Choice", "stem": "At what elevation break must a stairway or ladder be provided at a point of access?", "options": ["12 inches or more", "19 inches or more", "24 inches or more", "36 inches or more"], "answer": "B", "explain": "A break in elevation of 19 inches or more at a point of access requires a stairway or ladder, absent a ramp or equivalent."}, {"num": 3, "type": "Multiple Choice", "stem": "For a non-self-supporting ladder, the base should be positioned how far from the wall relative to the ladder's working length?", "options": ["1/8 of the length", "1/4 of the length", "The full length", "1/2 of the length"], "answer": "B", "explain": "The 4:1 rule: the base sits out about one-quarter of the ladder's working length for a safe climbing angle."}, {"num": 4, "type": "Multiple Choice", "stem": "How far above the landing surface must a portable ladder extend when accessing an upper level (unless secured at the top)?", "options": ["3 feet", "2 feet", "5 feet", "1 foot"], "answer": "A", "explain": "A portable ladder must extend at least 3 feet above the landing, or be secured at the top if it can't."}, {"num": 5, "type": "True/False", "stem": "The top step of a stepladder is safe to stand on as long as you hold onto something.", "options": [], "answer": "False", "explain": "The top step is never designed to bear weight as a standing surface, regardless of what you hold onto."}, {"num": 6, "type": "Multiple Choice", "stem": "Fixed ladders installed on or after November 19, 2018 that exceed 24 feet must have:", "options": ["A cage or well only", "A personal fall arrest system or ladder safety system", "Nothing extra, since ladders are inherently safe", "A spotter at the base at all times"], "answer": "B", "explain": "For ladders installed on or after that date, a cage or well alone no longer satisfies the fall protection requirement."}, {"num": 7, "type": "Multiple Choice", "stem": "What can happen to a section of a pre-2018 fixed ladder's cage if it needs to be replaced?", "options": ["The replaced section must meet the PFAS/ladder safety system standard", "Nothing \u2014 replacement isn't regulated", "It must be removed with no replacement", "It can be replaced with an identical cage section indefinitely"], "answer": "A", "explain": "Once a section of an older caged ladder is replaced or modified, that section has to meet the modern fall protection standard, even if the rest of the ladder is grandfathered."}, {"num": 8, "type": "True/False", "stem": "As of this training, OSHA's 2036 deadline for retrofitting older fixed ladder cages has been finalized as removed.", "options": [], "answer": "False", "explain": "OSHA proposed removing the 2036 deadline in April 2026, but as of this writing that proposal was still in the public comment/hearing process and had not become final. The 2036 deadline remains the current rule until OSHA issues a final decision."}, {"num": 9, "type": "Multiple Choice", "stem": "When climbing a ladder, how many points of contact should you maintain?", "options": ["Three", "It doesn't matter as long as you're facing forward", "Two", "One"], "answer": "A", "explain": "Maintaining three points of contact (two hands and a foot, or two feet and a hand) keeps you stable throughout the climb."}, {"num": 10, "type": "Multiple Choice", "stem": "ANSI or manufacturer approval labels on a ladder should be:", "options": ["Removed once the ladder is a year old", "Painted over for a uniform look", "Covered with tape to protect them", "Left visible and uncovered"], "answer": "D", "explain": "These labels must stay visible \u2014 covering them with paint or tape hides information about the ladder's rated capacity and approval."}], "has_checklist": false, "name": "Ladder Safety", "category": "Hot Work & Trade Safety"}, {"file": "LSFabco_Hand_Power_Tools_Training.docx", "title": "Hand Power Tools", "sections": [{"heading": null, "paragraphs": ["a.\tInspect cords, housings, and guards for damage before each use.", "b.\tNever remove, pin back, or bypass a guard to make the job easier.", "c.\tTag out and remove from service immediately any tool with a damaged cord, guard, or housing \u2014 don't \u201cjust be careful\u201d with it.", "d.\tUse the right tool for the task; don't modify a tool to do something it wasn't designed for."]}, {"heading": "Lockout/Tagout", "paragraphs": ["Before servicing, adjusting, or clearing a jam on powered equipment, de-energize it and apply your lock and tag at the source of power. Never rely on a switch or control alone \u2014 verify zero energy before putting your hands near moving parts."]}, {"heading": "Grinders & Cut-Off Wheels", "paragraphs": ["a.\tMatch the wheel's rated speed (RPM) to the tool, and inspect for cracks before mounting.", "b.\tKeep the guard in place, and stand to the side \u2014 not in line with \u2014 the wheel during startup.", "c.\tEye protection (safety glasses plus a face shield) is the minimum for grinding and cutting."]}, {"heading": "Extension Cords & Electrical", "paragraphs": ["a.\tUse GFCI protection for cord-connected tools on job sites.", "b.\tKeep cords out of walkways and away from sharp edges, heat, and standing water.", "c.\tInspect plugs and cords for cracked insulation or missing ground pins before each use."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Before servicing or adjusting powered equipment, what must you do?", "options": ["Ask a coworker to watch the switch", "De-energize and apply lockout/tagout at the source of power", "Unplug it if convenient", "Just turn off the switch"], "answer": "B", "explain": "A switch alone can be bumped or re-energized. Lockout/tagout at the source is what actually protects you."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the minimum eye protection for grinding or cutting operations?", "options": ["Safety glasses plus a face shield", "Reading glasses", "No eye protection needed if experienced", "Sunglasses"], "answer": "A", "explain": "Grinding throws debris fast enough that glasses alone aren't enough; a face shield adds the needed layer."}, {"num": 3, "type": "True/False", "stem": "A power tool with a damaged cord may keep being used as long as you are careful.", "options": [], "answer": "False", "explain": "A damaged cord is a shock and fire hazard. It needs to come out of service immediately, not get a workaround."}, {"num": 4, "type": "Multiple Choice", "stem": "What should be used to protect cord-connected tools on job sites?", "options": ["GFCI protection", "A longer extension cord", "Duct tape over the plug", "Nothing extra is needed"], "answer": "A", "explain": "GFCI protection cuts power fast enough to prevent a lethal shock if there's a ground fault."}], "has_checklist": false, "name": "Hand & Power Tools", "category": "Hot Work & Trade Safety"}, {"file": "LSFabco_Confined_Space_Training.docx", "title": "Confined Space", "sections": [{"heading": null, "paragraphs": ["Under Cal/OSHA Title 8 Section 5157 and 29 CFR 1910.146, a permit-required confined space is large enough to enter, has limited entry/exit, is not designed for continuous occupancy, and has one or more of: a hazardous atmosphere, engulfment potential, converging walls or a sloping floor that could trap someone, or another recognized serious hazard. Digesters, wet wells, tanks, and similar vessels on L&S Fabco projects are treated as permit spaces unless a competent person has documented otherwise.", "Note:\tAtmospheric testing must be done in this order, every time: (1) oxygen content \u2014 acceptable range is 19.5% to 23.5%; (2) flammable/combustible gases \u2014 must stay below 10% of the Lower Explosive Limit; (3) toxic air contaminants, including hydrogen sulfide. Use a calibrated, direct-reading multi-gas monitor, and re-test after any ventilation change or work break."]}, {"heading": "Entry Team Roles", "paragraphs": ["a.\tEntry Supervisor \u2014 authorizes entry, verifies the permit and conditions, and can cancel the permit if conditions change.", "b.\tAttendant \u2014 stays outside the space for the entire entry, maintains communication with entrants, and calls for evacuation or rescue if needed; never enters the space to attempt a rescue.", "c.\tAuthorized Entrant(s) \u2014 use the equipment and procedures on the permit and evacuate immediately when told to or when they notice a warning sign, symptom, or alarm."]}, {"heading": "Biogas-Specific Hazards", "paragraphs": ["a.\tHydrogen sulfide (H2S) \u2014 toxic, and deadens the sense of smell at higher concentrations, so odor is not a reliable warning.", "b.\tMethane \u2014 flammable/explosive and can displace oxygen.", "c.\tOxygen deficiency from biological activity or gas displacement.", "d.\tEngulfment risk in wet wells and sludge/digestate."]}, {"heading": "Rescue & Ventilation Equipment", "paragraphs": ["a.\tForced-air ventilation blower running before and during entry where the atmosphere requires it.", "b.\tRetrieval system (harness, lifeline, tripod/winch) for vertical entries, unless it would increase the hazard.", "c.\tA means of summoning rescue arranged before entry begins \u2014 non-entry rescue is always the first option.", "d.\tAppropriate respiratory protection, including SCBA/supplied air where the atmosphere cannot be made safe, inspected before entry."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Before entering a permit-required confined space, atmospheric testing must be done in which order?", "options": ["Oxygen, then combustible gases, then toxic gases", "Combustibles, then toxics, then oxygen", "Any order is fine", "Toxics, then oxygen, then combustibles"], "answer": "A", "explain": "This order is required under Cal/OSHA Section 5157 and 29 CFR 1910.146. Combustible gas meters need adequate oxygen to read accurately, which is why oxygen is tested first."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the acceptable oxygen range for confined space entry?", "options": ["Any level above 5%", "10% to 15%", "25% to 30%", "19.5% to 23.5%"], "answer": "D", "explain": "Below 19.5% is oxygen-deficient; above 23.5% is oxygen-enriched and a fire hazard."}, {"num": 3, "type": "Multiple Choice", "stem": "Who must remain outside a permit space for the entire entry?", "options": ["The entry supervisor only, and only briefly", "The attendant", "A random coworker", "No one \u2014 all personnel may enter"], "answer": "B", "explain": "The attendant monitors entrants, maintains communication, and calls for rescue, and never enters the space to attempt a rescue."}, {"num": 4, "type": "True/False", "stem": "Odor alone is a reliable warning for dangerous hydrogen sulfide (H2S) levels.", "options": [], "answer": "False", "explain": "H2S deadens the sense of smell at higher concentrations, so odor is not reliable. Only a calibrated gas monitor is."}], "has_checklist": false, "name": "Confined Space Entry", "category": "Exposure & Health"}, {"file": "LSFabco_Heat_Illness_Prevention_Training.docx", "title": "Heat Illness Prevention", "sections": [{"heading": null, "paragraphs": ["California has its own heat illness prevention standards \u2014 separate rules for outdoor work (Title 8 \u00a73395) and indoor work (Title 8 \u00a73396, effective July 23, 2024). L&S Fabco crews may be covered by both, depending on whether the work is in the shop or in the field."]}, {"heading": "Water", "paragraphs": ["a.\tFresh, pure, suitably cool water must be available free of charge, located as close as practicable to where employees are working.", "b.\tAt least one quart of water per employee per hour must be available for the entire shift."]}, {"heading": "Shade & Cool-Down Areas \u2014 Outdoor Work (\u00a73395)", "paragraphs": ["a.\tShade must be present at all times once the outdoor temperature exceeds 80\u00b0F, sized to accommodate all employees on a rest or meal break sitting normally without touching each other.", "b.\tBelow 80\u00b0F, shade must still be provided upon request, even though it isn't mandatory to have it already set up.", "c.\tShade means blockage of direct sunlight that actually allows the body to cool \u2014 a car sitting in the sun with the engine off does not count."]}, {"heading": "Cool-Down Areas \u2014 Indoor Work (\u00a73396)", "paragraphs": ["For indoor workplaces (such as our fabrication shop) where the indoor temperature exceeds 82\u00b0F, at least one cool-down area must be available and kept below 82\u00b0F, located as close as practicable to the work area."]}, {"heading": "Rest", "paragraphs": ["a.\tEmployees may take a preventative cool-down rest in the shade or cool-down area whenever they feel the need to, for as long as needed \u2014 at least 5 minutes.", "b.\tA worker on a cool-down rest must be monitored for symptoms, encouraged to stay in the shade/cool-down area, and never ordered back to work until any signs or symptoms of heat illness have resolved.", "c.\tEmployees must never be discouraged from taking a cool-down rest when they need one."]}, {"heading": "High-Heat Procedures (80\u00b0F Outdoor Threshold Applies; Additional Steps at 95\u00b0F)", "paragraphs": ["a.\tWhen the temperature reaches or exceeds 95\u00b0F, additional \u201chigh-heat procedures\u201d apply on top of the standard water/shade/rest requirements.", "b.\tEmployees must take a mandatory cool-down rest of at least 10 minutes every 2 hours during high-heat conditions.", "c.\tEffective communication must be maintained with employees working alone or out of sight (radio, cell phone, or other means), and observation for signs of heat illness must be increased (buddy system or equivalent).", "d.\tNew employees, and any employee returning after 14+ days away, must be closely observed during a period of acclimatization to the heat."]}, {"heading": "Recognizing Heat Illness", "paragraphs": ["Early signs include fatigue, weakness, excessive sweating, headache, cramps, and nausea. Untreated heat exhaustion can progress to heat stroke \u2014 marked by confusion, hot/dry skin, collapse, or delirium \u2014 which is a medical emergency."]}, {"heading": "Emergency Response", "paragraphs": ["a.\tCall 911 (or the posted emergency number) immediately for signs of severe heat illness \u2014 don't wait to see if symptoms pass.", "b.\tProvide clear directions to emergency responders and render aid within the limits of your training; do not attempt medical care beyond that.", "c.\tNever leave a worker showing signs of heat illness alone, and never send them home without on-site first aid or professional medical evaluation."]}, {"heading": "Training & Written Plan", "paragraphs": ["Every employee is trained on this program before working in conditions where heat illness is a risk, and a written heat illness prevention plan is maintained and available on-site."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "At minimum, how much water must be available per employee per hour of work outdoors?", "options": ["One gallon", "One cup", "One quart", "One pint"], "answer": "C", "explain": "Cal/OSHA's outdoor heat standard requires at least one quart of water per employee per hour, available free of charge."}, {"num": 2, "type": "Multiple Choice", "stem": "At what outdoor temperature does shade become mandatory at all times, rather than just available on request?", "options": ["75\u00b0F", "70\u00b0F", "90\u00b0F", "80\u00b0F"], "answer": "D", "explain": "Once the outdoor temperature exceeds 80\u00b0F, shade must be present at all times, sized for everyone on a rest or meal break."}, {"num": 3, "type": "True/False", "stem": "Below 80\u00b0F outdoors, employees have no right to shade at all.", "options": [], "answer": "False", "explain": "Even below 80\u00b0F, shade must still be provided upon an employee's request \u2014 it just doesn't have to already be set up in advance."}, {"num": 4, "type": "Multiple Choice", "stem": "Under California's newer indoor heat illness standard, at what indoor temperature must a cool-down area be provided?", "options": ["78\u00b0F", "82\u00b0F", "75\u00b0F", "90\u00b0F"], "answer": "B", "explain": "Title 8 \u00a73396 (effective July 23, 2024) requires a cool-down area kept below 82\u00b0F once the indoor temperature exceeds 82\u00b0F."}, {"num": 5, "type": "Multiple Choice", "stem": "At minimum, how long can an employee take a preventative cool-down rest when they feel the need to?", "options": ["At least 5 minutes", "Exactly 2 minutes", "Only during scheduled breaks", "No minimum \u2014 supervisor's discretion"], "answer": "A", "explain": "Employees are entitled to a cool-down rest of at least 5 minutes whenever they feel the need, and must not be ordered back until symptoms resolve."}, {"num": 6, "type": "Multiple Choice", "stem": "At what outdoor temperature do mandatory high-heat procedures (like the 10-minute cool-down every 2 hours) take effect?", "options": ["85\u00b0F", "90\u00b0F", "80\u00b0F", "95\u00b0F"], "answer": "D", "explain": "High-heat procedures \u2014 including a mandatory 10-minute cool-down rest every 2 hours \u2014 apply once the temperature reaches or exceeds 95\u00b0F."}, {"num": 7, "type": "True/False", "stem": "New employees and workers returning after an extended absence need no special observation during hot weather.", "options": [], "answer": "False", "explain": "New employees, and anyone returning after 14 or more days away, must be closely observed during an acclimatization period \u2014 they're at higher risk until their bodies adjust."}, {"num": 8, "type": "Multiple Choice", "stem": "What should you do if a coworker shows signs of heat stroke (confusion, hot/dry skin, collapse)?", "options": ["Send them home to rest", "Have them walk it off", "Call 911 immediately and don't leave them alone", "Wait to see if it passes on its own"], "answer": "C", "explain": "Heat stroke is a medical emergency. Call for emergency help right away and stay with the affected worker until help arrives."}, {"num": 9, "type": "True/False", "stem": "An employee on a cool-down rest can be ordered back to work as soon as the break's minimum time is up, even if they still feel unwell.", "options": [], "answer": "False", "explain": "A worker must not be ordered back to work until any signs or symptoms of heat illness have resolved, even if that takes longer than the 5-minute minimum."}, {"num": 10, "type": "Multiple Choice", "stem": "Which of these is required as part of high-heat procedures at 95\u00b0F and above?", "options": ["Removing shade structures", "Skipping training for the day", "Maintaining effective communication with employees working alone", "Discontinuing all water breaks"], "answer": "C", "explain": "High-heat procedures require effective communication with isolated workers and increased observation for heat illness symptoms."}], "has_checklist": false, "name": "Heat Illness Prevention", "category": "Exposure & Health"}, {"file": "LSFabco_Bloodborne_Pathogens_Training.docx", "title": "Bloodborne Pathogens", "sections": [{"heading": null, "paragraphs": ["Bloodborne pathogens are infectious microorganisms present in human blood and certain other body fluids that can cause disease \u2014 HIV, Hepatitis B (HBV), and Hepatitis C (HCV) are the ones we're most concerned about. This training covers how exposure happens, how to prevent it, and what to do if it occurs."]}, {"heading": "How Exposure Happens", "paragraphs": ["Bloodborne pathogens spread through direct contact with infected blood or other potentially infectious materials (OPIM) entering the body \u2014 through non-intact skin (cuts, abrasions), mucous membranes (eyes, nose, mouth), or a puncture injury such as a needlestick or cut from a contaminated sharp object. They are not spread through casual contact, sharing food, or air."]}, {"heading": "Universal Precautions", "paragraphs": ["We treat all human blood and OPIM as if they are infectious, regardless of the source. This means the same precautions apply whether or not you know someone's infection status."]}, {"heading": "Exposure Control Plan", "paragraphs": ["a.\tA written Exposure Control Plan identifies job tasks with a reasonable risk of exposure and the methods used to eliminate or minimize that risk.", "b.\tThe plan is reviewed and updated at least annually, and whenever new tasks or procedures affect exposure risk."]}, {"heading": "Engineering & Work Practice Controls", "paragraphs": ["a.\tPuncture-resistant, labeled sharps containers are used for used needles and other contaminated sharps \u2014 never recap a used needle by hand.", "b.\tWash hands immediately after removing gloves and after any contact with blood or OPIM.", "c.\tNo eating, drinking, smoking, or applying cosmetics in areas where exposure to blood or OPIM is reasonably likely."]}, {"heading": "Personal Protective Equipment", "paragraphs": ["Gloves, and face/eye protection or gowns where splashing is possible, are provided at no cost to employees whose tasks involve exposure risk. PPE is removed before leaving the work area and disposed of or laundered as contaminated waste."]}, {"heading": "Hepatitis B Vaccination", "paragraphs": ["a.\tThe Hepatitis B vaccine is offered free of charge within 10 working days of initial assignment to any employee with occupational exposure risk.", "b.\tAn employee may decline the vaccine by signing a declination form, and may request it later at no cost if they change their mind."]}, {"heading": "If an Exposure Incident Occurs", "paragraphs": ["a.\tImmediately wash the exposed area with soap and water; flush mucous membranes (eyes, nose, mouth) with water.", "b.\tReport the incident to your supervisor right away \u2014 do not wait to see if symptoms develop.", "c.\tA confidential medical evaluation and follow-up is provided at no cost, including testing (with consent) and counseling as appropriate."]}, {"heading": "Labeling & Waste Disposal", "paragraphs": ["Containers of regulated waste, refrigerators storing blood/OPIM, and contaminated sharps containers are marked with the biohazard label or are color-coded (typically red) so they're clearly identifiable."]}, {"heading": "Training & Records", "paragraphs": ["a.\tTraining is provided at initial assignment and at least annually thereafter.", "b.\tA sharps injury log is maintained, and medical records related to exposure incidents are kept confidential and retained per applicable recordkeeping requirements."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What are bloodborne pathogens?", "options": ["Non-infectious substances", "Infectious microorganisms in blood/OPIM that can cause disease", "Harmless particles in the bloodstream", "Chemicals present in the blood"], "answer": "B", "explain": "HIV, Hepatitis B, and Hepatitis C are the primary bloodborne pathogens of concern in the workplace."}, {"num": 2, "type": "Multiple Choice", "stem": "How can bloodborne pathogens be transmitted in a workplace exposure?", "options": ["Sharing food with a coworker", "Through the air", "Casual contact like a handshake", "Direct contact with blood/OPIM through broken skin, mucous membranes, or a puncture injury"], "answer": "D", "explain": "Transmission requires infected blood or OPIM to actually enter the body \u2014 through non-intact skin, mucous membranes, or a sharps injury."}, {"num": 3, "type": "Multiple Choice", "stem": "What are \u201cuniversal precautions\u201d?", "options": ["Treating everyone equally in conversation", "Treating all blood and body fluids as if they are infectious, regardless of source", "Using universal safety symbols", "Wearing the same PPE for every task"], "answer": "B", "explain": "Universal precautions mean applying the same protective measures to all blood/OPIM, since you often can't know someone's infection status."}, {"num": 4, "type": "Multiple Choice", "stem": "What should you never do with a used needle?", "options": ["Wash your hands after handling it", "Recap it by hand", "Dispose of it in a sharps container", "Report a needlestick immediately"], "answer": "B", "explain": "Recapping a used needle by hand is one of the most common causes of accidental needlestick injuries \u2014 sharps go straight into a puncture-resistant container."}, {"num": 5, "type": "Multiple Choice", "stem": "When must the Hepatitis B vaccine be offered to an employee with occupational exposure risk?", "options": ["Only if the employee pays for it", "Never, unless requested", "Only after an actual exposure incident", "Within 10 working days of initial assignment"], "answer": "D", "explain": "The vaccine must be offered free of charge within 10 working days of initial assignment to at-risk tasks."}, {"num": 6, "type": "True/False", "stem": "An employee who declines the Hepatitis B vaccine can never request it later.", "options": [], "answer": "False", "explain": "An employee can decline initially and still request the vaccine later at no cost if they change their mind."}, {"num": 7, "type": "Multiple Choice", "stem": "What is the first step after a bloodborne pathogen exposure incident (like a splash or needlestick)?", "options": ["Finish the task first", "Wait to see if symptoms appear", "Keep it to yourself to avoid paperwork", "Wash the exposed area with soap and water (or flush mucous membranes with water) and report it immediately"], "answer": "D", "explain": "Immediate first aid and prompt reporting give the best chance of effective medical follow-up."}, {"num": 8, "type": "Multiple Choice", "stem": "How is regulated waste or a sharps container typically identified?", "options": ["A handwritten sticky note", "A barcode only", "No special marking is required", "A biohazard label or red color-coding"], "answer": "D", "explain": "Biohazard labeling or red color-coding makes contaminated waste clearly identifiable to everyone who might handle it."}, {"num": 9, "type": "Multiple Choice", "stem": "How often must bloodborne pathogens training be provided?", "options": ["At initial assignment and at least annually thereafter", "Only after an exposure incident", "Every five years", "Once, at hire, only"], "answer": "A", "explain": "Training happens at initial assignment and is repeated at least annually."}, {"num": 10, "type": "Multiple Choice", "stem": "What does the written Exposure Control Plan identify?", "options": ["Job tasks with a reasonable risk of exposure and the methods used to reduce that risk", "Company holiday policy", "Employee vacation schedules", "Parking assignments"], "answer": "A", "explain": "The plan is the roadmap for where exposure risk exists in our work and what controls address it."}], "has_checklist": false, "name": "Bloodborne Pathogens", "category": "Exposure & Health"}, {"file": "LSFabco_Hearing_Conservation_Training.docx", "title": "Hearing Conservation", "sections": [{"heading": null, "paragraphs": ["Hearing loss from workplace noise is preventable, but it usually happens painlessly and permanently over time \u2014 by the time it's noticeable, the damage is already done. This training covers when hearing protection is required and how our Hearing Conservation Program works."]}, {"heading": "Exposure Limits", "paragraphs": ["a.\tAction Level: an 8-hour time-weighted average (TWA) noise exposure of 85 decibels (dBA) triggers the Hearing Conservation Program \u2014 monitoring, audiometric testing, and training.", "b.\tPermissible Exposure Limit (PEL): 90 dBA as an 8-hour TWA is the maximum allowed without additional controls.", "c.\tNoise exposure is evaluated using a formula that accounts for both sound level and duration \u2014 louder noise is allowed for less time, and vice versa."]}, {"heading": "Use of Hearing Protection", "paragraphs": ["a.\tWhenever noise levels or exposure duration can't be reduced to permissible levels through other means, hearing protectors must be provided and worn.", "b.\tProtectors are fitted or selected for each individual by a competent person \u2014 plain cotton is never an acceptable substitute for real hearing protection.", "c.\tHearing protectors are provided at no cost and replaced as needed, in a range of styles for a comfortable, effective fit."]}, {"heading": "Selecting the Right Protector", "paragraphs": ["Selection accounts for the Noise Reduction Rating (NRR), the individual's daily noise exposure, variability in noise levels, communication needs, compatibility with other required PPE, and physical or climate factors.", "Note:\tA hearing protector's labeled NRR reflects ideal laboratory conditions. Real-world protection is typically lower, so don't assume the labeled NRR is what you're actually getting \u2014 correct fit matters as much as the rating."]}, {"heading": "Identifying Excessive Noise", "paragraphs": ["If you have to raise your voice to be heard by someone an arm's length away, the noise level likely requires protection. Machine information, personal observation, and employee-reported symptoms all factor into identifying areas that need attention \u2014 speak up if you notice a loud task or area that isn't already flagged."]}, {"heading": "Audiometric Testing", "paragraphs": ["Employees covered by the Hearing Conservation Program receive a baseline hearing test early in their exposure, and annual testing thereafter, to catch any change in hearing before it becomes disabling."]}, {"heading": "Training", "paragraphs": ["Training on the purpose of hearing protection, proper fit, and care of hearing protectors is provided to all employees in the Hearing Conservation Program."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What 8-hour TWA noise exposure triggers the Hearing Conservation Program (the \u201caction level\u201d)?", "options": ["85 dBA", "90 dBA", "100 dBA", "70 dBA"], "answer": "A", "explain": "85 dBA as an 8-hour TWA is the action level that triggers monitoring, testing, and training requirements."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the Permissible Exposure Limit (PEL) for noise as an 8-hour TWA?", "options": ["95 dBA", "85 dBA", "80 dBA", "90 dBA"], "answer": "D", "explain": "90 dBA as an 8-hour TWA is the maximum allowed without additional controls."}, {"num": 3, "type": "Multiple Choice", "stem": "What is not considered an acceptable hearing protective device?", "options": ["Foam earplugs", "Molded earplugs", "Plain cotton", "Earmuffs"], "answer": "C", "explain": "Plain cotton does not provide meaningful noise attenuation and is explicitly not an acceptable substitute."}, {"num": 4, "type": "Multiple Choice", "stem": "Who fits or selects appropriate hearing protectors for employees?", "options": ["A competent person", "Any coworker", "Whoever is available", "The employee alone, with no guidance"], "answer": "A", "explain": "A competent person individually fits or determines appropriate hearing protectors for each employee."}, {"num": 5, "type": "True/False", "stem": "The labeled Noise Reduction Rating (NRR) on a hearing protector reflects the protection you'll actually get on the job.", "options": [], "answer": "False", "explain": "The labeled NRR reflects ideal lab conditions; real-world protection is typically lower, so proper fit matters as much as the rating."}, {"num": 6, "type": "Multiple Choice", "stem": "How does hearing loss from noise exposure typically occur?", "options": ["Painfully and instantly", "Only after a single loud event", "It always reverses on its own", "Painlessly and permanently over time"], "answer": "D", "explain": "Noise-induced hearing loss is usually gradual and painless, which is exactly why prevention matters more than waiting for symptoms."}, {"num": 7, "type": "Multiple Choice", "stem": "What is a practical sign that a work area may have excessive noise?", "options": ["Bright lighting", "Employees whistling while working", "Having to raise your voice to be heard an arm's length away", "A clean work area"], "answer": "C", "explain": "Needing to shout over noise at close range is a simple, reliable signal that hearing protection is likely needed."}, {"num": 8, "type": "Multiple Choice", "stem": "How are hearing protectors provided to employees?", "options": ["At no cost, replaced as needed", "At a cost to the employee", "As a one-time issue with no replacements", "Only to supervisors"], "answer": "A", "explain": "Hearing protectors are provided free of charge and replaced as needed."}, {"num": 9, "type": "Multiple Choice", "stem": "What does audiometric testing under the Hearing Conservation Program involve?", "options": ["A one-time test at hire only", "No testing is required", "A baseline test followed by annual testing", "Testing only after a complaint"], "answer": "C", "explain": "A baseline test early in exposure, followed by annual testing, helps catch changes in hearing before they become disabling."}, {"num": 10, "type": "Multiple Choice", "stem": "Which factors are considered when selecting an appropriate hearing protector?", "options": ["Color preference only", "Daily noise exposure, NRR, communication needs, and compatibility with other PPE", "Cost only", "NRR only"], "answer": "B", "explain": "Protector selection weighs several real-world factors together, not just the labeled NRR."}], "has_checklist": false, "name": "Hearing Conservation", "category": "Exposure & Health"}, {"file": "LSFabco_Lead_Asbestos_Training.docx", "title": "Lead Asbestos", "sections": [{"heading": null, "paragraphs": ["Lead and asbestos are common in buildings and piping systems built before the 1980s \u2014 including the kind of legacy industrial and municipal facilities L&S Fabco often works in. Old pipe insulation (thermal system insulation, or TSI) is a classic asbestos hazard, and older coatings, solder, and fixtures can contain lead. Both are regulated separately under Cal/OSHA, with their own exposure limits and work practices."]}, {"heading": "Before Work Begins", "paragraphs": ["a.\tIn any building or system built before 1980, assess for lead and asbestos-containing materials before starting work that could disturb them.", "b.\tA certified asbestos/lead inspector determines presence and condition where materials are unknown \u2014 do not assume a pipe or surface is safe just because it isn't obviously labeled.", "c.\tInform all affected workers of confirmed or presumed lead/asbestos-containing materials on site before work begins."]}, {"heading": "Asbestos \u2014 Exposure Limits & Work Classes", "paragraphs": ["a.\tPermissible Exposure Limit (PEL): 0.1 fiber per cubic centimeter (f/cc) as an 8-hour TWA. Excursion limit: 1.0 f/cc over any 30-minute period.", "b.\tWork is classified by risk: Class I (removing thermal system insulation or surfacing material \u2014 highest risk), Class II (removing other asbestos-containing material like flooring or siding), Class III (repair/maintenance that may disturb ACM), and Class IV (custodial cleanup of asbestos debris).", "c.\tA competent person specifically trained in asbestos hazards oversees asbestos work and has the authority to correct hazards."]}, {"heading": "Lead \u2014 Exposure Limits", "paragraphs": ["a.\tPermissible Exposure Limit (PEL): 50 micrograms per cubic meter (\u00b5g/m\u00b3) as an 8-hour TWA.", "b.\tAction Level: 30 \u00b5g/m\u00b3 as an 8-hour TWA \u2014 crossing this level for more than 30 days a year triggers medical surveillance (blood lead level monitoring)."]}, {"heading": "Work Practices", "paragraphs": ["a.\tUse wet methods or local exhaust ventilation to control dust generation \u2014 never dry sweep, dry sand, or use compressed air to clean up lead or asbestos dust.", "b.\tMinimize breaking, cutting, or otherwise disturbing lead- or asbestos-containing material whenever possible.", "c.\tIsolate work areas with plastic sheeting and clear signage to prevent the spread of contamination to unaffected areas.", "d.\tNo eating, drinking, or smoking in regulated work areas."]}, {"heading": "PPE & Respiratory Protection", "paragraphs": ["a.\tProvide appropriate PPE \u2014 respiratory protection, gloves, and disposable or washable coveralls \u2014 based on the exposure assessment.", "b.\tRespirators must be NIOSH-approved, properly fitted, and used under a written Respiratory Protection Program (see the separate Respiratory Protection training)."]}, {"heading": "Decontamination & Waste", "paragraphs": ["a.\tUse designated decontamination areas for workers to remove contaminated clothing and equipment before leaving the work area.", "b.\tUse HEPA-filtered vacuums for cleanup \u2014 never a standard shop vacuum.", "c.\tLabel and seal waste containers properly, and dispose of them only at authorized facilities."]}, {"heading": "Air Monitoring & Recordkeeping", "paragraphs": ["Air monitoring assesses whether controls are working and exposures stay within permissible limits. Training, exposure assessments, air monitoring results, and any corrective actions are documented and retained as required by Cal/OSHA."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What should be done before starting work in a building constructed before 1980?", "options": ["Remove all old materials immediately without assessment", "Assume no hazards are present", "Nothing extra is needed", "Assess for potential lead and asbestos-containing materials"], "answer": "D", "explain": "Pre-1980 construction is treated as a flag for potential lead and asbestos hazards until assessed."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the asbestos Permissible Exposure Limit (PEL) as an 8-hour TWA?", "options": ["1.0 f/cc", "0.01 f/cc", "0.1 f/cc", "10 f/cc"], "answer": "C", "explain": "0.1 fiber per cubic centimeter as an 8-hour TWA is the asbestos PEL, with a 1.0 f/cc excursion limit over 30 minutes."}, {"num": 3, "type": "Multiple Choice", "stem": "Which class of asbestos work involves removing thermal system insulation (like old pipe insulation) or surfacing material?", "options": ["Class IV \u2014 custodial cleanup", "None \u2014 pipe insulation isn't classified", "Class III \u2014 repair/maintenance", "Class I \u2014 the highest risk category"], "answer": "D", "explain": "Removing thermal system insulation or surfacing material is Class I work, the highest-risk asbestos category."}, {"num": 4, "type": "Multiple Choice", "stem": "What is the lead action level as an 8-hour TWA?", "options": ["100 \u00b5g/m\u00b3", "30 \u00b5g/m\u00b3", "50 \u00b5g/m\u00b3", "10 \u00b5g/m\u00b3"], "answer": "B", "explain": "30 micrograms per cubic meter as an 8-hour TWA is the lead action level; exceeding it more than 30 days a year triggers medical surveillance."}, {"num": 5, "type": "Multiple Choice", "stem": "Which method should be used to control dust when working with lead or asbestos-containing material?", "options": ["Dry sweeping", "Compressed air", "A household vacuum", "Wet methods or local exhaust ventilation"], "answer": "D", "explain": "Wet methods and local exhaust ventilation control dust generation. Dry sweeping and compressed air spread contamination instead."}, {"num": 6, "type": "True/False", "stem": "A standard shop vacuum is acceptable for cleaning up lead or asbestos dust.", "options": [], "answer": "False", "explain": "Only a HEPA-filtered vacuum should be used \u2014 a standard shop vacuum can exhaust fine contaminated particles right back into the air."}, {"num": 7, "type": "Multiple Choice", "stem": "Who oversees asbestos work and has authority to correct hazards?", "options": ["Any available employee", "A competent person specifically trained in asbestos hazards", "No oversight is required", "The customer"], "answer": "B", "explain": "A trained competent person is required to oversee asbestos work specifically."}, {"num": 8, "type": "Multiple Choice", "stem": "What PPE is appropriate for lead/asbestos work based on the exposure assessment?", "options": ["Sunglasses only", "No PPE if the task is quick", "Respiratory protection, gloves, and protective coveralls", "Regular clothing only"], "answer": "C", "explain": "PPE is matched to the actual exposure assessment, typically including respiratory protection, gloves, and coveralls."}, {"num": 9, "type": "Multiple Choice", "stem": "Before leaving a lead/asbestos work area, what should a worker do?", "options": ["Shake off dust outdoors", "Nothing extra is needed", "Use the designated decontamination area to remove contaminated clothing/equipment", "Go straight to lunch"], "answer": "C", "explain": "Decontamination areas prevent contaminated clothing and equipment from spreading lead or asbestos beyond the work area."}, {"num": 10, "type": "Multiple Choice", "stem": "Why is recordkeeping important for lead and asbestos safety?", "options": ["It has no safety value", "It's only required for public buildings", "It documents exposure assessments, training, and corrective actions", "It's optional paperwork"], "answer": "C", "explain": "Records of monitoring, training, and corrective actions demonstrate the program is actually working and provide a paper trail if questions arise later."}], "has_checklist": false, "name": "Lead & Asbestos", "category": "Exposure & Health"}, {"file": "LSFabco_Respiratory_Protection_Training.docx", "title": "Respiratory Protection", "sections": [{"heading": null, "paragraphs": ["Respiratory protection is used when engineering controls alone can't keep airborne contaminants or oxygen levels within safe limits. This training covers respirator types, medical clearance, fit testing, and use requirements."]}, {"heading": "Controls Come First", "paragraphs": ["Engineering controls \u2014 enclosure, ventilation, substitution of less hazardous materials \u2014 are the primary defense against contaminated or oxygen-deficient air. Respirators are used when those controls aren't fully effective on their own, or while they're being implemented."]}, {"heading": "Types of Respirators", "paragraphs": ["a.\tAir-purifying respirators filter contaminants out of the air you breathe \u2014 negative-pressure types (inhalation draws air through the filter) or positive-pressure/powered air-purifying types (a blower forces air through the filter).", "b.\tAtmosphere-supplying respirators (supplied air or SCBA) provide clean breathable air from an independent source \u2014 used in oxygen-deficient atmospheres or where contaminants can't be filtered.", "c.\tAll respirators used must be NIOSH-approved for the specific hazard."]}, {"heading": "Particulate Respirator Selection", "paragraphs": ["Selection accounts for the airborne particulate concentration, the permissible exposure limit, and the assigned protection factor (APF) needed. N-series filters are for particulates not containing oil; R- and P-series filters are rated for use with oil-based particulates. Filters are replaced when damaged, soiled, or when breathing resistance noticeably increases."]}, {"heading": "Medical Evaluation", "paragraphs": ["Before using a respirator, an employee must complete a medical evaluation (questionnaire or exam) to confirm they're medically able to wear one, considering the respirator type, duration of use, physical effort involved, and work conditions. Follow-up evaluations are provided as needed."]}, {"heading": "Fit Testing", "paragraphs": ["a.\tTight-fitting respirators require a fit test before first use, and periodically afterward, to confirm the specific make/model/size actually seals to that person's face.", "b.\tA user seal check is performed by the wearer every time the respirator is put on, in addition to the periodic formal fit test.", "c.\tFacial hair that crosses the sealing surface of a tight-fitting respirator is not permitted \u2014 it breaks the seal, no matter how careful the fit test was."]}, {"heading": "Use, Care & Maintenance", "paragraphs": ["a.\tInspect the respirator before each use for damaged straps, cracked facepiece, or clogged/expired filters.", "b.\tClean, disinfect, and store respirators properly between uses \u2014 not tossed loose in a toolbox where the facepiece can be damaged or contaminated.", "c.\tKnow the respirator's limitations \u2014 no respirator protects against every hazard, and none functions in an oxygen-deficient atmosphere unless it's an atmosphere-supplying type."]}, {"heading": "Program Administration", "paragraphs": ["The Respiratory Protection Program Administrator oversees hazard evaluation, respirator selection, fit testing, training, and recordkeeping (fit test, medical evaluation, and training records)."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What comes before respirators in the hierarchy of protection against airborne hazards?", "options": ["Buying a better brand of respirator", "Nothing \u2014 respirators are always first", "Administrative signage only", "Engineering controls such as ventilation, enclosure, or substitution"], "answer": "D", "explain": "Engineering controls are the primary defense; respirators supplement them when controls alone aren't sufficient."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the difference between an air-purifying respirator and an atmosphere-supplying respirator?", "options": ["There is no difference", "Air-purifying respirators work in oxygen-deficient atmospheres", "Atmosphere-supplying respirators are always smaller", "Air-purifying filters contaminants from ambient air; atmosphere-supplying provides air from an independent clean source"], "answer": "D", "explain": "Air-purifying respirators only filter existing air \u2014 they don't work in oxygen-deficient atmospheres, which require an atmosphere-supplying respirator."}, {"num": 3, "type": "Multiple Choice", "stem": "What must be true of any respirator used for protection against a workplace hazard?", "options": ["It must be NIOSH-approved for that hazard", "It has no requirements as long as it fits", "It must be the newest model available", "It must be positive-pressure only"], "answer": "A", "explain": "NIOSH approval for the specific hazard is a baseline requirement for any respirator used."}, {"num": 4, "type": "Multiple Choice", "stem": "Before using a respirator, what must an employee complete?", "options": ["A medical evaluation to confirm they're medically able to wear one", "Only a vision test", "Nothing extra", "A written essay"], "answer": "A", "explain": "A medical evaluation considers the respirator type, duration, physical effort, and conditions before someone is cleared to wear one."}, {"num": 5, "type": "Multiple Choice", "stem": "What does a fit test confirm?", "options": ["That the specific make/model/size actually seals to that person's face", "That the respirator is the newest model", "That the wearer likes the color", "Nothing important"], "answer": "A", "explain": "A fit test verifies an actual working seal for that specific person and respirator \u2014 a respirator that fits one person may not fit another."}, {"num": 6, "type": "True/False", "stem": "A user seal check when putting on a respirator replaces the need for a periodic formal fit test.", "options": [], "answer": "False", "explain": "A seal check is done every time the respirator is worn, but it's in addition to \u2014 not a replacement for \u2014 the periodic formal fit test."}, {"num": 7, "type": "Multiple Choice", "stem": "Why is facial hair crossing the sealing surface of a tight-fitting respirator a problem?", "options": ["It only matters for full-face respirators", "It isn't a problem", "It breaks the seal regardless of how well the respirator otherwise fits", "It's a cosmetic issue only"], "answer": "C", "explain": "Facial hair under the sealing surface creates gaps that let unfiltered air in, no matter how good the fit test result was."}, {"num": 8, "type": "Multiple Choice", "stem": "When should a respirator filter be replaced?", "options": ["When damaged, soiled, or when breathing resistance noticeably increases", "Never, if it still fits", "Only once a year, regardless of use", "Only when visibly torn"], "answer": "A", "explain": "Any of these conditions means the filter is no longer performing as intended and needs to be replaced."}, {"num": 9, "type": "Multiple Choice", "stem": "What should be done with a respirator when it's not in use?", "options": ["Left in direct sunlight for drying", "Passed casually between coworkers", "Cleaned, disinfected, and stored properly", "Left loose in a toolbox"], "answer": "C", "explain": "Proper cleaning and storage protect the respirator from damage and contamination between uses."}, {"num": 10, "type": "Multiple Choice", "stem": "Who oversees respirator selection, fit testing, and recordkeeping for the program?", "options": ["No one \u2014 it's self-managed", "Each individual employee, independently", "The equipment manufacturer", "The Respiratory Protection Program Administrator"], "answer": "D", "explain": "A designated Program Administrator oversees the respiratory protection program as a whole."}], "has_checklist": false, "name": "Respiratory Protection", "category": "Exposure & Health"}, {"file": "LSFabco_Silica_Training.docx", "title": "Silica", "sections": [{"heading": null, "paragraphs": ["Respirable crystalline silica dust \u2014 generated by cutting, grinding, or drilling concrete, block, stone, and similar materials \u2014 causes silicosis and other serious lung disease with repeated exposure. This program applies to all workplace exposures unless exposure remains below the action level under any foreseeable condition."]}, {"heading": "Key Definitions", "paragraphs": ["a.\tAction Level: 25 micrograms per cubic meter (\u00b5g/m\u00b3) of air, as an 8-hour time-weighted average (TWA).", "b.\tPermissible Exposure Limit (PEL): 50 \u00b5g/m\u00b3 as an 8-hour TWA \u2014 the maximum allowed exposure.", "c.\tCompetent Person: someone authorized to identify and address respirable crystalline silica hazards in our work.", "d.\tRespirable Crystalline Silica: airborne particles of quartz, cristobalite, and/or tridymite small enough to be inhaled deep into the lungs."]}, {"heading": "Specified Exposure Control Methods", "paragraphs": ["For tasks involving silica-containing materials, specific engineering controls, work practices, and (where required) respiratory protection are used based on the equipment and task involved \u2014 for example, water delivery systems on saws and grinders, or on-tool dust extraction with a HEPA filter."]}, {"heading": "Alternative Exposure Control Methods", "paragraphs": ["Where the specified controls aren't fully feasible, exposure must still be kept at or below the PEL of 50 \u00b5g/m\u00b3 as an 8-hour TWA:", "a.\tExposure assessment is conducted through performance monitoring or scheduled monitoring.", "b.\tReassessment is required whenever there's a change in production, process, equipment, personnel, or work practices that could affect exposure.", "c.\tEmployees are notified of assessment results in writing or by posting; if exposure exceeds the PEL, corrective actions are identified in that notification."]}, {"heading": "Methods of Compliance", "paragraphs": ["a.\tEngineering and work practice controls are used first to bring exposure to or below the PEL.", "b.\tWhere those controls alone aren't sufficient, respiratory protection is used in combination with them to keep exposure as low as feasible.", "c.\tNever dry sweep or use compressed air to clean up silica dust \u2014 use wet methods or a HEPA vacuum."]}, {"heading": "Abrasive Blasting", "paragraphs": ["If abrasive blasting involves silica-containing blasting agents or substrates, additional OSHA standards specific to abrasive blasting apply on top of the silica requirements."]}, {"heading": "Medical Surveillance", "paragraphs": ["Employees required to wear a respirator for silica exposure 30 or more days a year are offered medical surveillance, including a baseline exam and periodic follow-up."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What is the action level for respirable crystalline silica as an 8-hour TWA?", "options": ["50 \u00b5g/m\u00b3", "25 \u00b5g/m\u00b3", "10 \u00b5g/m\u00b3", "100 \u00b5g/m\u00b3"], "answer": "B", "explain": "25 micrograms per cubic meter as an 8-hour TWA is the action level that triggers program requirements."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the Permissible Exposure Limit (PEL) for respirable crystalline silica as an 8-hour TWA?", "options": ["25 \u00b5g/m\u00b3", "50 \u00b5g/m\u00b3", "100 \u00b5g/m\u00b3", "250 \u00b5g/m\u00b3"], "answer": "B", "explain": "50 micrograms per cubic meter as an 8-hour TWA is the maximum allowable exposure."}, {"num": 3, "type": "Multiple Choice", "stem": "Who is responsible for identifying and addressing silica hazards in the workplace?", "options": ["A Competent Person", "Any employee", "The customer", "No one specific role is required"], "answer": "A", "explain": "A designated Competent Person is specifically authorized to identify and address respirable crystalline silica hazards."}, {"num": 4, "type": "Multiple Choice", "stem": "What is required when there's a change in production, process, equipment, or personnel that could affect silica exposure?", "options": ["A one-time note in a log", "Waiting for the next scheduled review, however far off", "Nothing, unless requested", "Reassessment of exposure"], "answer": "D", "explain": "A change in these factors specifically triggers a reassessment of exposure, not just a passive note."}, {"num": 5, "type": "Multiple Choice", "stem": "What is the primary objective of engineering and work practice controls for silica?", "options": ["Simplify recordkeeping", "Meet regulatory requirements only", "Minimize employee exposure", "Reduce equipment maintenance"], "answer": "C", "explain": "The whole point of these controls is actually reducing exposure, not just satisfying a checklist."}, {"num": 6, "type": "True/False", "stem": "Dry sweeping is an acceptable way to clean up silica dust as long as it's done quickly.", "options": [], "answer": "False", "explain": "Dry sweeping and compressed air both put silica dust back into the air. Wet methods or a HEPA vacuum are required instead."}, {"num": 7, "type": "Multiple Choice", "stem": "If abrasive blasting involves silica-containing substrates, what applies?", "options": ["No additional standards", "The silica rule doesn't apply to blasting", "Only company policy, no regulation", "Additional OSHA standards specific to abrasive blasting, on top of silica requirements"], "answer": "D", "explain": "Abrasive blasting with silica-containing materials brings in additional applicable standards beyond the general silica rule."}, {"num": 8, "type": "Multiple Choice", "stem": "Who is offered medical surveillance under the silica program?", "options": ["No one, medical surveillance isn't part of this program", "Only supervisors", "Employees required to wear a respirator for silica exposure 30+ days a year", "Everyone regardless of exposure"], "answer": "C", "explain": "Medical surveillance is tied to that specific respirator-use threshold, not a blanket requirement for all employees."}, {"num": 9, "type": "Multiple Choice", "stem": "What is an example of a specified engineering control for a silica-generating task?", "options": ["Opening a window", "Wearing sunglasses", "Working faster to finish sooner", "Water delivery on a saw or on-tool dust extraction with a HEPA filter"], "answer": "D", "explain": "Water suppression and HEPA-filtered dust extraction are standard specified controls for common silica-generating tools."}, {"num": 10, "type": "Multiple Choice", "stem": "How are employees notified if a silica exposure assessment exceeds the PEL?", "options": ["Only verbally, informally", "Only if they ask", "They aren't notified", "In writing or through appropriate posting, along with corrective actions"], "answer": "D", "explain": "Formal written or posted notification, including corrective actions, is required when exposure exceeds the PEL."}], "has_checklist": false, "name": "Silica", "category": "Exposure & Health"}, {"file": "LSFabco_Fall_Protection_Training.docx", "title": "Fall Protection", "sections": [{"heading": null, "paragraphs": ["Falls are one of the leading causes of serious workplace injuries and fatalities in construction. This training covers when fall protection is required, the hierarchy of fall protection methods, and the equipment and inspection requirements that apply to our work."]}, {"heading": "When Fall Protection Is Required", "paragraphs": ["Cal/OSHA's general fall protection trigger height is lower than the federal OSHA standard many national safety materials describe:", "a.\tGeneral fall protection (Title 8 \u00a71669\u20131670): required at 7\u00bd feet or more above a lower level \u2014 not 6 feet. This is a California-specific requirement that differs from federal OSHA's general construction standard.", "b.\tResidential-type framing and residential-type roofing, slopes 0:12\u20137:12 (Title 8 \u00a71716.2 and \u00a71731): as of July 1, 2025, the trigger height was lowered from 15 feet to 6 feet, matching the federal OSHA standard for this work.", "c.\tNon-residential (commercial) roofing (Title 8 \u00a71730): trigger height is 20 feet. Panelized roof systems: 15 feet.", "Note:\tWhen in doubt about which trigger height applies to a specific task, treat 7\u00bd feet as the default and confirm with your supervisor before working at height without conventional fall protection."]}, {"heading": "Hierarchy of Fall Protection", "paragraphs": ["a.\tElimination/Substitution \u2014 whenever possible, eliminate the need to work at height or use a safer method (e.g., assembling at ground level).", "b.\tEngineering Controls \u2014 guardrails, safety nets, or other physical barriers that prevent a fall from happening.", "c.\tPersonal Fall Protection Systems \u2014 used when the hazard cannot be eliminated or controlled by engineering controls: personal fall arrest systems (PFAS), positioning devices, and fall restraint systems."]}, {"heading": "Personal Fall Arrest Systems (PFAS)", "paragraphs": ["a.\tA complete PFAS consists of a full-body harness, a connector (lanyard or self-retracting lifeline), and an anchor point.", "b.\tAnchor points must be capable of supporting at least 5,000 pounds per attached employee, or be part of a complete system engineered with a safety factor of at least two, and must be independent of anchorage used to support or suspend platforms.", "c.\tInspect harnesses, lanyards, and connectors before every use \u2014 look for cuts, fraying, burns, chemical damage, and worn or corroded hardware.", "Note:\tCalifornia adds a requirement most out-of-state safety materials don't mention: in addition to the before-each-use check, a competent person must perform and document a formal inspection of personal fall protection equipment at least twice a year (Title 8 \u00a71670(b)(19))."]}, {"heading": "Written Fall Protection Plan", "paragraphs": ["When conventional fall protection is infeasible or would create a greater hazard, a written fall protection plan is required before work begins. The plan must identify the fall hazards, the reason conventional protection isn't used, and the specific procedures that will be used instead (Title 8 \u00a71671.1)."]}, {"heading": "Rescue Planning", "paragraphs": ["A worker suspended in a fall arrest system after a fall is at risk of suspension trauma within minutes. A rescue plan \u2014 not just a rescue \"hope\" \u2014 must be in place before work at height begins, and everyone on the crew must know it."]}, {"heading": "Training", "paragraphs": ["a.\tWorkers must be trained on fall hazard recognition, proper equipment use, and emergency/rescue procedures before working at height.", "b.\tRetraining is required whenever there's reason to believe a worker lacks the skill or understanding needed for safe fall protection practices, or when equipment or conditions change."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Under Cal/OSHA's general fall protection standard, at what height is fall protection required?", "options": ["10 feet", "7\u00bd feet", "15 feet", "6 feet"], "answer": "B", "explain": "Title 8 \u00a71669\u20131670 sets California's general fall protection trigger height at 7\u00bd feet, higher than the federal OSHA standard many generic training materials describe."}, {"num": 2, "type": "Multiple Choice", "stem": "As of July 1, 2025, what is the trigger height for residential-type framing and residential roofing (slopes 0:12\u20137:12) under Cal/OSHA?", "options": ["20 feet", "15 feet", "6 feet", "7\u00bd feet"], "answer": "C", "explain": "Cal/OSHA lowered this trigger height from 15 feet to 6 feet effective July 1, 2025, bringing it in line with the federal OSHA standard for the same work."}, {"num": 3, "type": "Multiple Choice", "stem": "What is the first step in the hierarchy of fall protection?", "options": ["Engineering controls", "Personal fall arrest systems", "Safety nets", "Elimination or substitution"], "answer": "D", "explain": "Eliminating or substituting away the need to work at height comes before any engineering control or personal protective system."}, {"num": 4, "type": "Multiple Choice", "stem": "What are the three components of a complete personal fall arrest system (PFAS)?", "options": ["Full-body harness, connector (lanyard/SRL), and anchor point", "Ladder, scaffold, and safety net", "Hard hat, gloves, and boots", "Guardrail, toeboard, and mid-rail"], "answer": "A", "explain": "A PFAS is only complete with all three components working together \u2014 harness, connecting device, and a suitable anchor."}, {"num": 5, "type": "Multiple Choice", "stem": "At minimum, what must an anchor point for a PFAS be capable of supporting?", "options": ["5,000 pounds per person, or engineered with a safety factor of at least 2", "500 pounds per person", "Whatever the worker weighs", "1,000 pounds per person"], "answer": "A", "explain": "This is the standard anchor point capacity requirement \u2014 either the flat 5,000-lb-per-person rating, or a system specifically engineered with at least a 2:1 safety factor."}, {"num": 6, "type": "True/False", "stem": "A quick visual check before each use is the only inspection California requires for personal fall protection equipment.", "options": [], "answer": "False", "explain": "California requires a documented, competent-person inspection of personal fall protection equipment at least twice a year, in addition to the before-each-use check (Title 8 \u00a71670(b)(19))."}, {"num": 7, "type": "Multiple Choice", "stem": "When is a written fall protection plan required?", "options": ["Never \u2014 verbal instructions are sufficient", "Only for roofing work", "For every task at any height", "When conventional fall protection is infeasible or creates a greater hazard"], "answer": "D", "explain": "A written plan (Title 8 \u00a71671.1) is required specifically when conventional fall protection can't be used, documenting why and what will be done instead."}, {"num": 8, "type": "True/False", "stem": "A rescue plan only needs to be developed after a fall actually happens.", "options": [], "answer": "False", "explain": "A rescue plan must be in place before work at height begins. A worker suspended in a harness can develop suspension trauma within minutes, so there's no time to improvise a plan afterward."}, {"num": 9, "type": "Multiple Choice", "stem": "Which of these is an engineering control for fall protection?", "options": ["A positioning device", "A full-body harness", "A warning line alone", "A guardrail system"], "answer": "D", "explain": "Guardrails are a physical barrier that prevents the fall from happening at all, placing them in the engineering-controls tier of the hierarchy."}, {"num": 10, "type": "Multiple Choice", "stem": "Before working at height, what must workers be trained to recognize and do?", "options": ["Only how to inspect scaffolding", "Fall hazards, proper equipment use, and emergency/rescue procedures", "Only how to fill out paperwork", "Nothing beyond basic orientation"], "answer": "B", "explain": "Fall protection training must cover hazard recognition, correct equipment use, and what to do in an emergency \u2014 not just one of these."}], "has_checklist": false, "name": "Fall Protection", "category": "General Safety & Compliance"}, {"file": "LSFabco_Lockout_Tagout_Training.docx", "title": "Lockout Tagout", "sections": [{"heading": null, "paragraphs": ["Lockout/Tagout prevents machinery and equipment from being unexpectedly energized, started up, or releasing stored energy while someone is servicing or maintaining it. This is one of the most safety-critical procedures in our work \u2014 it applies to electrical, mechanical, hydraulic, pneumatic, thermal, and any other hazardous energy source."]}, {"heading": "Key Terms", "paragraphs": ["a.\tLockout \u2014 placing a lock on an energy-isolating device so the equipment physically cannot be operated.", "b.\tTagout \u2014 attaching a prominent warning tag to an energy-isolating device indicating it must not be operated; used together with lockout, not as a substitute for it, whenever a lockout device can be used.", "c.\tAuthorized employee \u2014 someone trained and authorized to perform lockout/tagout and service the equipment.", "d.\tAffected employee \u2014 someone who operates or works near equipment being serviced under LOTO, but does not perform the lockout themselves."]}, {"heading": "The LOTO Procedure", "paragraphs": ["1.\tNotify \u2014 tell all affected employees that equipment will be shut down and locked out.", "2.\tShut down \u2014 turn off the equipment using its normal stopping procedure.", "3.\tIsolate \u2014 disconnect the equipment from every energy source that applies to it.", "4.\tApply lockout/tagout devices \u2014 each authorized employee working on the equipment applies their own lock and tag to the energy-isolating device(s).", "5.\tRelease stored energy \u2014 bleed down, block, or otherwise render safe any stored energy (spring tension, hydraulic pressure, capacitors, elevated components, etc.).", "6.\tVerify \u2014 confirm isolation by attempting to start the equipment using normal controls (then return controls to neutral/off) before beginning work.", "Note:\tOnly the employee who applied a lock may remove it. If that person is unavailable, removal by someone else requires a specific documented procedure (verifying the employee is not in danger, making a genuine attempt to contact them, and informing them before they return to work) \u2014 it is never a casual decision."]}, {"heading": "Group Lockout", "paragraphs": ["When more than one crew or trade is working on the same piece of equipment, a group lockout procedure is used \u2014 often a lockbox where each authorized employee places their own personal lock, so the equipment cannot be re-energized until everyone has removed theirs."]}, {"heading": "Training & Authorization", "paragraphs": ["a.\tOnly trained, authorized employees may perform lockout/tagout.", "b.\tAffected employees must be trained on the purpose of LOTO and instructed never to attempt to restart or bypass locked-out equipment."]}, {"heading": "Periodic Inspection", "paragraphs": ["LOTO procedures must be inspected at least annually by someone other than the employee using the procedure, to confirm the procedure is being followed correctly and locks/tags are in good condition."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "What is the primary purpose of lockout/tagout?", "options": ["To speed up maintenance", "To reduce energy costs", "To track equipment usage", "To prevent unexpected energization or release of stored energy during servicing"], "answer": "D", "explain": "LOTO exists specifically to prevent equipment from starting up or releasing hazardous energy while someone is working on it."}, {"num": 2, "type": "Multiple Choice", "stem": "What is the key difference between lockout and tagout?", "options": ["They are the same thing", "Tagout physically prevents operation; lockout doesn't", "Lockout is for electrical equipment only", "Lockout uses a physical lock; tagout uses a warning tag"], "answer": "D", "explain": "A lock physically disables the energy-isolating device; a tag is a warning that should be used together with a lock, not as a substitute for it, whenever lockout is capable of being used."}, {"num": 3, "type": "Multiple Choice", "stem": "What comes immediately after \"Isolate\" in the LOTO sequence?", "options": ["Apply lockout/tagout devices", "Notify", "Verify", "Perform work"], "answer": "A", "explain": "The sequence runs Notify \u2192 Shut Down \u2192 Isolate \u2192 Apply Locks/Tags \u2192 Release Stored Energy \u2192 Verify \u2192 Perform Work."}, {"num": 4, "type": "Multiple Choice", "stem": "Who may remove a lock applied during LOTO?", "options": ["Only the employee who applied it, except under a specific documented procedure", "Any employee working nearby", "Whoever needs the equipment back in service", "Any supervisor"], "answer": "A", "explain": "Locks are removed by the person who applied them. Removal by someone else requires a documented exception procedure \u2014 it's never routine."}, {"num": 5, "type": "Multiple Choice", "stem": "Before beginning work under a LOTO procedure, what must be verified?", "options": ["Nothing further is needed once locks are applied", "That isolation is effective, by attempting to start the equipment with normal controls", "That the equipment is clean", "That paperwork is filed"], "answer": "B", "explain": "Verification confirms the isolation actually worked \u2014 skipping this step means finding out the hard way if something was missed."}, {"num": 6, "type": "Multiple Choice", "stem": "What is a group lockout procedure used for?", "options": ["Multiple crews/trades working on the same equipment, each applying their own lock", "Working alone on equipment", "Skipping individual locks to save time", "Only electrical work"], "answer": "A", "explain": "A group lockout (often via a lockbox) ensures equipment can't be re-energized until every crew member's individual lock has been removed."}, {"num": 7, "type": "True/False", "stem": "An affected employee (someone who works near locked-out equipment but doesn't service it) may attempt to restart it if they think the work is done.", "options": [], "answer": "False", "explain": "Affected employees are trained specifically never to attempt to restart, bypass, or interfere with locked-out equipment."}, {"num": 8, "type": "Multiple Choice", "stem": "How often must LOTO procedures be inspected?", "options": ["Every 5 years", "Only after an incident", "Never, once established", "At least annually, by someone other than the user"], "answer": "D", "explain": "A periodic inspection at least once a year, by someone other than the person who normally uses the procedure, confirms it's still being followed correctly."}, {"num": 9, "type": "Multiple Choice", "stem": "Which of these counts as an energy source that LOTO applies to?", "options": ["Electrical only", "Only energy sources that are currently active", "Mechanical only", "Electrical, mechanical, hydraulic, pneumatic, thermal, and other stored energy"], "answer": "D", "explain": "LOTO covers every form of hazardous energy that could injure someone \u2014 not just electrical."}, {"num": 10, "type": "Multiple Choice", "stem": "Before performing work, what must be done with any stored energy (like spring tension or hydraulic pressure)?", "options": ["Ignored if the main power is off", "Safely released, blocked, or dissipated", "Left as-is if it seems stable", "Documented only, not addressed"], "answer": "B", "explain": "Stored energy can cause injury even after the main power source is isolated \u2014 it must be actively released or restrained before work begins."}], "has_checklist": false, "name": "Lockout/Tagout", "category": "General Safety & Compliance"}, {"file": "LSFabco_PPE_Training.docx", "title": "PPE", "sections": [{"heading": null, "paragraphs": ["PPE protects against hazards that can't be fully eliminated through engineering or administrative controls. This training covers how PPE is selected, when it's required, and everyone's role in making the program work."]}, {"heading": "Where PPE Fits", "paragraphs": ["a.\tEngineering and administrative controls are preferred over PPE whenever feasible \u2014 PPE is the last line of defense, not the first.", "b.\tPPE does not replace safe work practices. Wearing the right gear while ignoring a hazard is not compliance."]}, {"heading": "Hazard Assessment", "paragraphs": ["a.\tA hazard assessment identifies workplace hazards to eye, face, head, hand, foot, and hearing, among others, and determines what PPE is needed to address them.", "b.\tA Certificate of Hazard Assessment documenting this process is kept on file and available for inspection.", "c.\tHazard assessments are reviewed and updated as tasks, equipment, or work areas change."]}, {"heading": "Selection & Standards", "paragraphs": ["a.\tPPE selected to protect against a specific hazard should match or exceed the level of protection that hazard requires.", "b.\tMost PPE is manufactured to specific ANSI standards \u2014 proper sizing and use are necessary to maintain that certified level of protection.", "c.\tOnce a type of PPE is required in a given area or task, it must be worn by everyone present, regardless of job title."]}, {"heading": "Categories & Key Points", "paragraphs": ["a.\tEye and face protection \u2014 safety glasses at minimum for general hazards; face shields added for grinding, cutting, or chemical splash risks.", "b.\tHead protection \u2014 hard hats where there's a risk of falling or fixed objects, or exposed electrical hazards.", "c.\tHand protection \u2014 gloves matched to the hazard (cut resistance, chemical resistance, thermal protection) \u2014 no single glove protects against everything.", "d.\tFoot protection \u2014 protective footwear rated for impact, compression, electrical, or puncture hazards as applicable to the task.", "e.\tHearing protection \u2014 see the separate Hearing Conservation training for noise-specific requirements.", "f.\tRespiratory protection \u2014 see the separate Respiratory Protection training; requires medical evaluation and fit testing before use."]}, {"heading": "Training", "paragraphs": ["a.\tEmployees are trained on when PPE is necessary, what PPE is necessary, and how to properly put on, adjust, wear, and remove it.", "b.\tTraining also covers the limitations of the PPE provided, and its proper care, maintenance, useful life, and disposal.", "c.\tEmployees must demonstrate understanding and the ability to use PPE correctly before performing work that requires it."]}], "questions": [{"num": 1, "type": "Multiple Choice", "stem": "Which is preferred over PPE whenever feasible?", "options": ["Ignoring minor hazards", "Buying more expensive PPE", "Engineering and administrative controls", "Nothing \u2014 PPE always comes first"], "answer": "C", "explain": "PPE is the last line of defense in the hierarchy of controls, used when a hazard can't be fully addressed through engineering or administrative measures."}, {"num": 2, "type": "Multiple Choice", "stem": "What does a hazard assessment determine?", "options": ["Which employees are liked best", "What PPE is needed to address identified workplace hazards", "Employee pay rates", "Vacation schedules"], "answer": "B", "explain": "The hazard assessment is the basis for matching the right PPE to the actual hazards present in a work area or task."}, {"num": 3, "type": "Multiple Choice", "stem": "What document records that a hazard assessment has been performed?", "options": ["A Certificate of Hazard Assessment", "An employee's resume", "A time card", "A vehicle inspection log"], "answer": "A", "explain": "This certificate documents the assessment and is kept available for inspection."}, {"num": 4, "type": "Multiple Choice", "stem": "Once a specific type of PPE is required for an area or task, who must wear it?", "options": ["Only those who ask for it", "Only hourly employees", "Only new employees", "Everyone present, regardless of job title"], "answer": "D", "explain": "PPE requirements apply to everyone in the identified area or task \u2014 job title or seniority doesn't create an exception."}, {"num": 5, "type": "Multiple Choice", "stem": "Why does proper sizing matter for ANSI-rated PPE?", "options": ["Improper sizing can compromise the certified level of protection", "It's only about comfort", "ANSI ratings ignore sizing", "It doesn't matter, any size works"], "answer": "A", "explain": "PPE is only as protective as its fit allows \u2014 an ANSI
